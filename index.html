<style>
:root {
  --primary:#336B57;--primary-h:#2a5a48;--primary-l:#4a9070;--primary-xl:#5daf8a;
  --primary-bg:#eaf2ee;--primary-a10:rgba(51,107,87,.1);--primary-a20:rgba(51,107,87,.2);
  --bg:#f3f4f6;--surface:#ffffff;--surface2:#f9fafb;
  --text:#111827;--text-s:#6b7280;--text-xs:#9ca3af;
  --border:#e5e7eb;--border-l:#f3f4f6;
  --red:#ef4444;--red-bg:#fef2f2;--green:#22c55e;--green-bg:#f0fdf4;
  --yellow:#f59e0b;--yellow-bg:#fffbeb;--blue:#3b82f6;--blue-bg:#eff6ff;
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 6px rgba(0,0,0,.05),0 2px 4px rgba(0,0,0,.04);
  --shadow-lg:0 10px 25px rgba(0,0,0,.08);
  --font:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',sans-serif;
  --nav-h:68px;--header-h:56px;--transition:.2s ease;
}
[data-theme="dark"] {
  --bg:#0c0f14;--surface:#161a22;--surface2:#1c2029;
  --text:#e5e7eb;--text-s:#9ca3af;--text-xs:#6b7280;
  --border:#2a2e38;--border-l:#1e222b;
  --primary-bg:#15231c;--primary-a10:rgba(74,144,112,.12);--primary-a20:rgba(74,144,112,.2);
  --red-bg:#1f1215;--green-bg:#0f1f15;--yellow-bg:#1f1a0f;--blue-bg:#0f1520;
  --shadow:0 1px 3px rgba(0,0,0,.2);--shadow-md:0 4px 8px rgba(0,0,0,.2);--shadow-lg:0 10px 30px rgba(0,0,0,.3);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit;font-size:inherit}
#pin-screen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#265043 0%,#336B57 40%,#4a9070 100%)}
.pin-card{background:var(--surface);border-radius:20px;padding:40px 32px;width:min(360px,90vw);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.pin-logo{font-size:28px;font-weight:800;color:var(--primary);letter-spacing:2px;margin-bottom:4px}
.pin-subtitle{font-size:12px;color:var(--text-s);margin-bottom:28px;letter-spacing:4px;text-transform:uppercase}
.pin-icon{font-size:40px;margin-bottom:20px}
.pin-input-wrap{position:relative;margin-bottom:16px}
.pin-input-wrap input{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:var(--radius-sm);text-align:center;font-size:24px;letter-spacing:8px;background:var(--surface2);color:var(--text);outline:none;transition:border var(--transition)}
.pin-input-wrap input:focus{border-color:var(--primary)}
.pin-input-wrap input.shake{animation:shake .5s ease}
.pin-error{color:var(--red);font-size:13px;min-height:20px;margin-bottom:12px}
.pin-btn{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:600;cursor:pointer;transition:background var(--transition)}
.pin-btn:hover{background:var(--primary-h)}
#app{display:none;height:100vh;flex-direction:column}
#app.active{display:flex}
.app-header{height:var(--header-h);padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.app-header h1{font-size:18px;font-weight:700;color:var(--primary);letter-spacing:1px}
.header-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--surface2);color:var(--text-s);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition);font-size:18px}
.icon-btn:hover{background:var(--primary-a10);color:var(--primary)}
.views-container{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:var(--nav-h);scroll-behavior:smooth}
.view{display:none;padding:16px;animation:fadeIn .25s ease}
.view.active{display:block}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;z-index:100;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--text-xs);cursor:pointer;padding:8px 12px;border-radius:var(--radius-sm);transition:all var(--transition);min-width:60px}
.nav-btn svg{width:22px;height:22px;stroke-width:1.8}
.nav-btn span{font-size:11px;font-weight:500}
.nav-btn.active{color:var(--primary)}
.nav-btn.active svg{stroke-width:2.2}
.nav-btn:hover{color:var(--primary-l);background:var(--primary-a10)}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border-l);transition:all var(--transition)}
.card:hover{box-shadow:var(--shadow-md)}
.cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
.balance-card{position:relative;overflow:hidden;padding-left:20px}

<body>

<script>
'use strict';

/* ======== CONSTANTS ======== */
const PIN = '20111653';
const CATEGORIES = {
  'Transporte': ['Bus','Taxi','Metropolitano','Colectivo'],
  'Comida': ['Restaurante','PYA','Menu'],
  'Mascotas': ['Arena','Comida','Veterinario','Pipetas','Panes con pollo'],
  'Alessandro': ['Mes','Propina','Ingles','Taller','Gustos','TM'],
  'Deporte': ['Especifico','Suscripcion','Implementos'],
  'Servicios': ['Casa','Mes','Internet','Luz','Agua','Gas','Celular'],
  'Ropa': [],
  'Tecnologia': [],
  'Cuidado Personal': ['Cabello','Piel','Carita','Pies'],
  'Limpieza': [],
  'Abarrotes': [],
  'Entretenimiento': ['Cine','Juegos','Libros','Teatro','WeWe']
};
const INCOME_TYPES = {
  'Sueldo': 'debito', 'Gratificacion': 'debito', 'Utilidades': 'debito',
  'Liquidacion': 'debito', 'Adicionales': null, 'Freelos': null, 'Prestamos': null
};
const TYPE_LABELS = {
  income: 'Ingreso', expense: 'Egreso', cash_withdrawal: 'Retiro Efectivo',
  savings_in: 'Ahorro +', savings_out: 'Ahorro -', debt_payment: 'Pago Deuda'
};
const SOURCE_LABELS = { debito: 'Cuenta Debito', efectivo: 'Efectivo', ahorro: 'Ahorro' };
const DEBT_PAYMENT_METHODS = ['Tarjeta de Credito','Debito','Efectivo'];

/* ======== DATA ======== */
let data = { transactions: [], debts: [], settings: { darkMode: true }, balances: {
  debitoPEN:0, debitoUSD:0, efectivoPEN:0, efectivoUSD:0, ahorroPEN:0, ahorroUSD:0
}};
let currentView = 'home';
let txPage = 1;
const TX_PER_PAGE = 20;
let txFilters = { type:'all', category:'all', currency:'all', search:'', dateFrom:'', dateTo:'' };
let chartInstances = {};
let dashFilter = 'month';

function loadData() {
  try {
    const saved = localStorage.getItem('fnzs_acb_data');
    if (saved) { data = JSON.parse(saved); }
  } catch(e) { console.error('Load error:', e); }
  if (!data.balances) data.balances = {debitoPEN:0,debitoUSD:0,efectivoPEN:0,efectivoUSD:0,ahorroPEN:0,ahorroUSD:0};
  if (!data.transactions) data.transactions = [];
  if (!data.debts) data.debts = [];
  if (!data.settings) data.settings = {darkMode:true};
}
function saveData() {
  recalcBalances();
  try { localStorage.setItem('fnzs_acb_data', JSON.stringify(data)); } catch(e) { console.error('Save error:', e); }
}
function recalcBalances() {
  const b = {debitoPEN:0,debitoUSD:0,efectivoPEN:0,efectivoUSD:0,ahorroPEN:0,ahorroUSD:0};
  data.transactions.forEach(tx => {
    const c = tx.currency;
    switch(tx.type) {
      case 'income':
        if (tx.destination === 'debito') b['debito'+c] += tx.amount;
        else if (tx.destination === 'efectivo') b['efectivo'+c] += tx.amount;
        break;
      case 'expense':
        if (tx.source === 'debito') b['debito'+c] -= tx.amount;
        else if (tx.source === 'efectivo') b['efectivo'+c] -= tx.amount;
        break;
      case 'cash_withdrawal':
        b['debito'+c] -= tx.amount;
        b['efectivo'+c] += tx.amount;
        break;
      case 'savings_in':
        if (tx.source === 'debito') b['debito'+c] -= tx.amount;
        else if (tx.source === 'efectivo') b['efectivo'+c] -= tx.amount;
        b['ahorro'+c] += tx.amount;
        break;
      case 'savings_out':
        b['ahorro'+c] -= tx.amount;
        if (tx.destination === 'debito') b['debito'+c] += tx.amount;
        else if (tx.destination === 'efectivo') b['efectivo'+c] += tx.amount;
        break;
      case 'debt_payment':
        if (tx.source === 'debito') b['debito'+c] -= tx.amount;
        else if (tx.source === 'efectivo') b['efectivo'+c] -= tx.amount;
        else if (tx.source === 'ahorro') b['ahorro'+c] -= tx.amount;
        break;
    }
  });
  data.balances = b;
  // Recalc debt paid amounts
  data.debts.forEach(d => {
    d.paidAmount = data.transactions
      .filter(tx => tx.type === 'debt_payment' && tx.debtId === d.id)
      .reduce((sum, tx) => sum + tx.amount, 0);
    d.status = d.paidAmount >= d.totalAmount ? 'paid' : 'active';
  });
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }
function fmtMoney(amount, currency) {
  const sym = currency === 'USD' ? '$ ' : 'S/ ';
  const sign = amount < 0 ? '-' : '';
  return sign + sym + Math.abs(amount).toLocaleString('es-PE', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(d) {
  const dt = new Date(d);
  return dt.toLocaleDateString('es-PE', {day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtDateTime(d) {
  const dt = new Date(d);
  return dt.toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' +
         dt.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',hour12:false});
}
function nowISO() {
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off * 60000);
  return local.toISOString().slice(0, 16);
}
function showToast(msg, type) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast toast-' + (type || 'success');
  const icons = {success:'\u2705', error:'\u274C', info:'\u2139\uFE0F'};
  t.innerHTML = (icons[type] || icons.success) + ' ' + msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(100%)'; t.style.transition = '.3s ease'; setTimeout(() => t.remove(), 300); }, 3000);
}
function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('active');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
}

/* ======== PIN ======== */
function checkPin() {
  const input = document.getElementById('pin-input');
  const err = document.getElementById('pin-error');
  if (input.value === PIN) {
    document.getElementById('pin-screen').style.display = 'none';
    document.getElementById('app').classList.add('active');
    renderCurrentView();
  } else {
    err.textContent = 'PIN incorrecto';
    input.classList.add('shake');
    setTimeout(() => input.classList.remove('shake'), 500);
    input.value = '';
    input.focus();
  }
}
document.addEventListener('DOMContentLoaded', function() {
  const pinInput = document.getElementById('pin-input');
  pinInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') checkPin(); });
  pinInput.focus();
});

/* ======== NAVIGATION ======== */
function navigateTo(view) {
  currentView = view;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.getElementById('views-container').scrollTop = 0;
  renderCurrentView();
}
function renderCurrentView() {
  switch(currentView) {
    case 'home': renderHome(); break;
    case 'transactions': renderTransactions(); break;
    case 'dashboard': renderDashboard(); break;
    case 'settings': renderSettings(); break;
  }
}

function renderRecentTx() {
  const recent = data.transactions.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);
  if (!recent.length) return '<div class="empty-state"><div class="empty-icon">&#128203;</div><p>No hay movimientos registrados aun.<br>Usa las acciones rapidas para comenzar.</p></div>';
  let rows = recent.map(tx => {
    const isNeg = ['expense','cash_withdrawal','savings_in','debt_payment'].includes(tx.type);
    const sign = isNeg ? '-' : '+';
    const cls = isNeg ? 'amount-negative' : 'amount-positive';
    const label = tx.type === 'expense' ? (tx.category || '') : (TYPE_LABELS[tx.type] || '');
    return `<tr>
      <td style="white-space:nowrap">${fmtDate(tx.date)}</td>
      <td><span class="type-badge ${tx.type}">${TYPE_LABELS[tx.type]}</span></td>
      <td>${label}${tx.subcategory ? ' / '+tx.subcategory : ''}</td>
      <td class="${cls}" style="font-weight:600;white-space:nowrap">${sign} ${fmtMoney(tx.amount,tx.currency)}</td>
    </tr>`;
  }).join('');
  return `<div class="section-title" style="margin-top:8px">Movimientos Recientes</div>
    <div class="table-wrap card" style="padding:0"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th>Monto</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function renderActiveDebts() {
  const active = data.debts.filter(d => d.status === 'active');
  if (!active.length) return '';
  let items = active.map(d => {
    const remaining = d.totalAmount - (d.paidAmount||0);
    const pct = d.totalAmount > 0 ? Math.min(100, ((d.paidAmount||0)/d.totalAmount)*100) : 0;
    return `<div class="card debt-item">
      <div class="debt-header"><span class="debt-name">${d.name}${d.category?' <span style="font-size:11px;color:var(--primary-l);font-weight:400">('+d.category+')</span>':''}</span><span class="debt-status active">Activa</span></div>
      <div class="debt-amounts"><span>Pagado: ${fmtMoney(d.paidAmount||0,d.currency)}</span><span>Pendiente: ${fmtMoney(remaining,d.currency)}</span></div>
      <div class="progress-bar"><div class="progress-fill green" style="width:${pct}%"></div></div>
      <div style="font-size:11px;color:var(--text-xs);text-align:right">${pct.toFixed(1)}% completado</div>
    </div>`;
  }).join('');
  return `<div class="section-title" style="margin-top:16px">Deudas Activas</div>${items}`;
}

  const t = document.getElementById('inc-type').value;

function saveIncome(editId) {
  const amount = parseFloat(document.getElementById('inc-amount').value);
  const currency = document.getElementById('inc-currency').value;
  const incType = document.getElementById('inc-type').value;
  const dest = document.getElementById('inc-dest').value;
  const date = document.getElementById('inc-date').value;
  const notes = document.getElementById('inc-notes').value.trim();
  if (!amount || amount <= 0) { showToast('Ingresa un monto valido','error'); return; }
  if (!date) { showToast('Selecciona una fecha','error'); return; }
  const tx = {
    id: editId || genId(), type:'income', amount, currency, incomeType:incType,
    destination:dest, source:null, category:incType, subcategory:null, debtId:null,
    date:date, notes, createdAt: editId ? undefined : new Date().toISOString()
  };
  if (editId) {
    const idx = data.transactions.findIndex(t=>t.id===editId);
    if (idx>=0) { tx.createdAt = data.transactions[idx].createdAt; data.transactions[idx] = tx; }
  } else { data.transactions.push(tx); }
  saveData(); closeModal();
  showToast(editId ? 'Ingreso actualizado' : 'Ingreso registrado');

      +'<div class="debt-amount-row" id="debt-amt-'+d.id+'" style="display:none;margin-top:8px;padding-left:28px">'
      +'<input type="number" class="form-control debt-pay-input" data-debt-id="'+d.id+'" step="0.01" min="0.01" max="'+rem+'" placeholder="Monto a pagar" oninput="updatePayTotal()" style="font-size:13px">'
      +'</div></div>';
  }).join('');
  const html = '<div class="modal-header"><h3>Pagar Deudas</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>'
    +'<div class="modal-body">'
    +'<div class="form-group"><label style="margin-bottom:8px;display:block">Selecciona las deudas a pagar:</label>'+debtChecks+'</div>'
    +'<div class="form-group"><label>Origen del Dinero *</label><select class="form-control" id="pay-source"><option value="debito">Cuenta Debito</option><option value="efectivo">Efectivo</option><option value="ahorro">Ahorro</option></select></div>'
    +'<div class="form-group"><label>Fecha</label><input type="datetime-local" class="form-control" id="pay-date" value="'+nowISO()+'"></div>'
    +'<div class="form-group"><label>Notas</label><textarea class="form-control" id="pay-notes" placeholder="Notas opcionales..."></textarea></div>'
    +'<div id="pay-total-summary" style="padding:12px;background:var(--primary-a10);border-radius:var(--radius-sm);text-align:center;font-weight:600;display:none">Total a pagar: <span id="pay-total-amount">S/ 0.00</span></div>'
    +'</div><div class="modal-footer"><div style="display:flex;gap:8px">'
    +'<button class="btn btn-secondary" onclick="closeModal();showCreateDebtForm()">+ Nueva Deuda</button>'
    +'<button class="btn btn-primary" style="flex:1" onclick="saveMultiPayDebt()">Pagar Seleccionadas</button>'
    +'</div></div>';
  openModal(html);
}
function toggleDebtAmount(checkbox) {
  const id = checkbox.value;
  const row = document.getElementById('debt-amt-'+id);
  row.style.display = checkbox.checked ? 'block' : 'none';
  if (!checkbox.checked) { const inp = row.querySelector('input'); if(inp) inp.value=''; }
  updatePayTotal();
}
function updatePayTotal() {
  const inputs = document.querySelectorAll('.debt-pay-input');
  let totals = {};
  inputs.forEach(inp => {
    const v = parseFloat(inp.value) || 0;
    if (v > 0) {
      const dId = inp.getAttribute('data-debt-id');
      const debt = data.debts.find(d=>d.id===dId);
      if (debt) { totals[debt.currency] = (totals[debt.currency]||0) + v; }
    }
  });
  const summary = document.getElementById('pay-total-summary');
  const totalEl = document.getElementById('pay-total-amount');
  const parts = Object.entries(totals).map(([c,v])=>fmtMoney(v,c)).join(' + ');
  if (parts) { summary.style.display='block'; totalEl.textContent=parts; }
  else { summary.style.display='none'; }
}
function saveMultiPayDebt() {
  const checks = document.querySelectorAll('.debt-check:checked');
  if (!checks.length) { showToast('Selecciona al menos una deuda','error'); return; }
  const source = document.getElementById('pay-source').value;
  const date = document.getElementById('pay-date').value;
  const notes = document.getElementById('pay-notes').value.trim();
  let count = 0;
  checks.forEach(chk => {
    const dId = chk.value;
    const inp = document.querySelector('.debt-pay-input[data-debt-id="'+dId+'"]');
    const amount = parseFloat(inp ? inp.value : 0);
    if (!amount || amount<=0) return;
    const debt = data.debts.find(d=>d.id===dId);
    if (!debt) return;
    data.transactions.push({
      id:genId(), type:'debt_payment', amount, currency:debt.currency,
      source, destination:null, category:debt.category||'Pago Deuda', subcategory:debt.subcategory||debt.name,
      incomeType:null, debtId:dId, date, notes:notes||(debt.name+' - '+(debt.method||'')), createdAt:new Date().toISOString()
    });
    count++;
  });
  if (!count) { showToast('Ingresa montos validos en las deudas seleccionadas','error'); return; }
  saveData(); closeModal();
  showToast(count===1?'Pago de deuda registrado':count+' pagos de deuda registrados');
  renderCurrentView();
}
function savePayDebt(editId) {
  const debtId = document.getElementById('pay-debt').value;
  const amount = parseFloat(document.getElementById('pay-amount').value);
  const source = document.getElementById('pay-source').value;
  const date = document.getElementById('pay-date').value;
  const notes = document.getElementById('pay-notes').value.trim();
  if (!amount || amount <= 0) { showToast('Ingresa un monto valido','error'); return; }
  const debt = data.debts.find(d => d.id === debtId);
  if (!debt) { showToast('Deuda no encontrada','error'); return; }
  const tx = {
    id: editId || genId(), type:'debt_payment', amount, currency:debt.currency,
    source, destination:null, category:debt.category||'Pago Deuda', subcategory:debt.subcategory||debt.name,
    incomeType:null, debtId, date, notes:notes||(debt.name+' - '+debt.method), createdAt: editId ? undefined : new Date().toISOString()
  };
  if (editId) {
    const idx = data.transactions.findIndex(t=>t.id===editId);
    if (idx>=0) { tx.createdAt = data.transactions[idx].createdAt; data.transactions[idx] = tx; }
  } else { data.transactions.push(tx); }
  saveData(); closeModal();
  showToast(editId ? 'Pago actualizado' : 'Pago de deuda registrado');
  renderCurrentView();
}

function saveSavings(editId) {

/* ======== EDIT / DELETE ======== */
function editTransaction(id) {
  const tx = data.transactions.find(t => t.id === id);
  if (!tx) return;
  closeModal();
  setTimeout(() => {
    switch(tx.type) {
      case 'income': showIncomeForm(tx); break;
      case 'expense': showExpenseForm(tx); break;
      case 'cash_withdrawal': showExpenseForm({...tx, source:'retiro'}); break;
      case 'savings_in': case 'savings_out': showSavingsForm(tx); break;
      case 'debt_payment': showPayDebtForm(tx); break;
    }
  }, 100);
}
function deleteTransaction(id) {
  const tx = data.transactions.find(t => t.id === id);
  if (!tx) return;
  showConfirm('Eliminar Movimiento',
    'Esta accion eliminara este movimiento y recalculara todos los saldos. No se puede deshacer.',
    function() {
      data.transactions = data.transactions.filter(t => t.id !== id);
      saveData();
      showToast('Movimiento eliminado');
      renderCurrentView();
    });
}

/* ======== TRANSACTIONS VIEW ======== */
function renderTransactions() {
  const allTypes = [...new Set(data.transactions.map(t=>t.type))];
  const allCats = [...new Set(data.transactions.filter(t=>t.category).map(t=>t.category))].sort();
  const typeFilterOpts = '<option value="all">Todos</option>' + allTypes.map(t => `<option value="${t}" ${txFilters.type===t?'selected':''}>${TYPE_LABELS[t]||t}</option>`).join('');
  const catFilterOpts = '<option value="all">Todas</option>' + allCats.map(c => `<option value="${c}" ${txFilters.category===c?'selected':''}>${c}</option>`).join('');

  let filtered = data.transactions.slice();
  if (txFilters.type !== 'all') filtered = filtered.filter(t => t.type === txFilters.type);
  if (txFilters.category !== 'all') filtered = filtered.filter(t => t.category === txFilters.category);
  if (txFilters.currency !== 'all') filtered = filtered.filter(t => t.currency === txFilters.currency);
  if (txFilters.dateFrom) filtered = filtered.filter(t => t.date >= txFilters.dateFrom);
  if (txFilters.dateTo) filtered = filtered.filter(t => t.date <= txFilters.dateTo + 'T23:59:59');
  if (txFilters.search) {
    const s = txFilters.search.toLowerCase();
    filtered = filtered.filter(t =>
      (t.category||'').toLowerCase().includes(s) ||
      (t.subcategory||'').toLowerCase().includes(s) ||
      (t.notes||'').toLowerCase().includes(s) ||
      (t.incomeType||'').toLowerCase().includes(s) ||
      (TYPE_LABELS[t.type]||'').toLowerCase().includes(s)
    );
  }
  filtered.sort((a,b) => new Date(b.date) - new Date(a.date));
  const totalPages = Math.max(1, Math.ceil(filtered.length / TX_PER_PAGE));
  if (txPage > totalPages) txPage = totalPages;
  const start = (txPage - 1) * TX_PER_PAGE;
  const page = filtered.slice(start, start + TX_PER_PAGE);

  let tableRows = '';
  if (page.length === 0) {
    tableRows = '<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--text-s)">No se encontraron movimientos</td></tr>';
  } else {
    tableRows = page.map(tx => {
      const isNeg = ['expense','cash_withdrawal','savings_in','debt_payment'].includes(tx.type);
      const sign = isNeg ? '-' : '+';
      const cls = isNeg ? 'amount-negative' : 'amount-positive';
      const srcDst = tx.type==='cash_withdrawal' ? 'Debito → Efectivo' :
                     tx.type==='savings_in' ? (SOURCE_LABELS[tx.source]||'') + ' → Ahorro' :
                     tx.type==='savings_out' ? 'Ahorro → ' + (SOURCE_LABELS[tx.destination]||'') :
                     tx.type==='debt_payment' ? (SOURCE_LABELS[tx.source]||'') + ' → Deuda' :
                     tx.type==='income' ? '→ ' + (SOURCE_LABELS[tx.destination]||'') :
                     (SOURCE_LABELS[tx.source]||'');
      return `<tr>
        <td style="white-space:nowrap">${fmtDateTime(tx.date)}</td>
        <td><span class="type-badge ${tx.type}">${TYPE_LABELS[tx.type]}</span></td>
        <td>${tx.category||'-'}${tx.subcategory?' / '+tx.subcategory:''}</td>
        <td class="${cls}" style="font-weight:600;white-space:nowrap">${sign} ${fmtMoney(tx.amount,tx.currency)}</td>
        <td>${tx.currency}</td>
        <td style="font-size:12px">${srcDst}</td>
        <td style="font-size:12px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(tx.notes||'').replace(/"/g,'&quot;')}">${tx.notes||'-'}</td>
        <td><div class="row-actions"><button class="edit-btn" onclick="editTransaction('${tx.id}')" title="Editar">&#9998;</button><button class="del-btn" onclick="deleteTransaction('${tx.id}')" title="Eliminar">&#128465;</button></div></td>
      </tr>`;
    }).join('');
  }

  document.getElementById('view-transactions').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="font-size:20px;font-weight:700">Movimientos</h2>
      <span style="font-size:13px;color:var(--text-s)">${filtered.length} registro${filtered.length!==1?'s':''}</span>
    </div>
    <div class="filters-bar">
      <div class="search-wrap"><span class="search-icon">&#128269;</span><input class="search-input" placeholder="Buscar..." value="${txFilters.search}" oninput="txFilters.search=this.value;txPage=1;renderTransactions()"></div>
      <select class="filter-select" onchange="txFilters.type=this.value;txPage=1;renderTransactions()">${typeFilterOpts}</select>
      <select class="filter-select" onchange="txFilters.category=this.value;txPage=1;renderTransactions()">${catFilterOpts}</select>
      <select class="filter-select" onchange="txFilters.currency=this.value;txPage=1;renderTransactions()">
        <option value="all" ${txFilters.currency==='all'?'selected':''}>PEN+USD</option>
        <option value="PEN" ${txFilters.currency==='PEN'?'selected':''}>PEN</option>
        <option value="USD" ${txFilters.currency==='USD'?'selected':''}>USD</option>
      </select>
      <input type="date" class="filter-select" value="${txFilters.dateFrom}" onchange="txFilters.dateFrom=this.value;txPage=1;renderTransactions()" title="Desde">
      <input type="date" class="filter-select" value="${txFilters.dateTo}" onchange="txFilters.dateTo=this.value;txPage=1;renderTransactions()" title="Hasta">
    </div>
    <div class="table-wrap card" style="padding:0">
      <table>
        <thead><tr><th>Fecha</th><th>Tipo</th><th>Categoria</th><th>Monto</th><th>Mon.</th><th>Origen/Destino</th><th>Notas</th><th></th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
    ${totalPages > 1 ? `
    <div class="pagination">
      <button class="btn btn-sm btn-secondary" onclick="txPage=Math.max(1,txPage-1);renderTransactions()" ${txPage<=1?'disabled':''}>&#8592; Anterior</button>
      <span class="page-info">Pagina ${txPage} de ${totalPages}</span>
      <button class="btn btn-sm btn-secondary" onclick="txPage=Math.min(${totalPages},txPage+1);renderTransactions()" ${txPage>=totalPages?'disabled':''}>Siguiente &#8594;</button>
    </div>` : ''}`;
}

/* ======== DASHBOARD ======== */
function renderDashboard() {
  const b = data.balances;
  const liqPEN = b.debitoPEN + b.efectivoPEN;
  const liqUSD = b.debitoUSD + b.efectivoUSD;
  const savPEN = b.ahorroPEN; const savUSD = b.ahorroUSD;
  const debtPEN = data.debts.filter(d=>d.currency==='PEN'&&d.status==='active').reduce((s,d)=>s+(d.totalAmount-(d.paidAmount||0)),0);
  const debtUSD = data.debts.filter(d=>d.currency==='USD'&&d.status==='active').reduce((s,d)=>s+(d.totalAmount-(d.paidAmount||0)),0);
  const netPEN = liqPEN + savPEN - debtPEN;
  const netUSD = liqUSD + savUSD - debtUSD;

  const activeDebts = data.debts.filter(d => d.status === 'active');
  let debtBars = activeDebts.map(d => {
    const pct = d.totalAmount>0 ? Math.min(100,((d.paidAmount||0)/d.totalAmount)*100) : 0;

      <div class="card summary-card"><div class="sc-label">Fondo de Ahorro</div><div class="sc-value text-primary">${fmtMoney(savPEN,'PEN')}</div><div class="sc-sub">${fmtMoney(savUSD,'USD')}</div></div>
      <div class="card summary-card"><div class="sc-label">Deudas Pendientes</div><div class="sc-value text-red">${fmtMoney(debtPEN,'PEN')}</div><div class="sc-sub text-red">${fmtMoney(debtUSD,'USD')}</div></div>
      <div class="card summary-card"><div class="sc-label">Patrimonio Neto</div><div class="sc-value ${netPEN>=0?'text-green':'text-red'}">${fmtMoney(netPEN,'PEN')}</div><div class="sc-sub ${netUSD>=0?'text-green':'text-red'}">${fmtMoney(netUSD,'USD')}</div></div>
    </div>
    <div class="chart-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h4>Ingresos vs Egresos</h4>
        <div class="chart-filters">
          <button class="btn btn-sm ${dashFilter==='week'?'btn-primary':'btn-secondary'}" onclick="dashFilter='week';renderDashboard()">Semanas</button>
          <button class="btn btn-sm ${dashFilter==='month'?'btn-primary':'btn-secondary'}" onclick="dashFilter='month';renderDashboard()">Meses</button>
        </div>
      </div>
      <div class="chart-container"><canvas id="chart-income-expense"></canvas></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="chart-box"><h4>Egresos por Categoria</h4><div class="chart-container"><canvas id="chart-expense-cat"></canvas></div></div>
      <div class="chart-box"><h4>Ingresos por Tipo</h4><div class="chart-container"><canvas id="chart-income-type"></canvas></div></div>
    </div>
    ${debtBars ? '<div class="chart-box"><h4>Progreso de Deudas</h4>' + debtBars + '</div>' : ''}
  `;
  setTimeout(renderCharts, 50);
}

function renderCharts() {
  // Destroy existing
  Object.values(chartInstances).forEach(c => { if(c) c.destroy(); });
  chartInstances = {};
  const isDark = data.settings.darkMode;
  const gridColor = isDark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.06)';
  const textColor = isDark ? '#9ca3af' : '#6b7280';
  Chart.defaults.color = textColor;

  // Income vs Expense bar chart
  const barCtx = document.getElementById('chart-income-expense');
  if (barCtx) {
    const periods = getChartPeriods(dashFilter);
    const incomeData = []; const expenseData = []; const labels = [];
    periods.forEach(p => {
      labels.push(p.label);
      const txInPeriod = data.transactions.filter(t => t.date >= p.start && t.date <= p.end);
      incomeData.push(txInPeriod.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0));
      expenseData.push(txInPeriod.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0));
    });
    chartInstances.bar = new Chart(barCtx, {
      type:'bar',
      data:{ labels, datasets:[
        {label:'Ingresos',data:incomeData,backgroundColor:'rgba(51,107,87,.7)',borderRadius:4},
        {label:'Egresos',data:expenseData,backgroundColor:'rgba(239,68,68,.7)',borderRadius:4}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,padding:16}}},
        scales:{x:{grid:{display:false}},y:{grid:{color:gridColor},beginAtZero:true}}}
    });
  }

  // Expense pie
  const pieCtx = document.getElementById('chart-expense-cat');
  if (pieCtx) {
    const expenses = data.transactions.filter(t=>t.type==='expense');
    const catTotals = {};
    expenses.forEach(t => { catTotals[t.category] = (catTotals[t.category]||0) + t.amount; });
    const sorted = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
    const colors = ['#336B57','#ef4444','#3b82f6','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16','#06b6d4','#e11d48'];
    chartInstances.pie = new Chart(pieCtx, {
      type:'doughnut',
      data:{ labels:sorted.map(s=>s[0]), datasets:[{data:sorted.map(s=>s[1]),backgroundColor:colors.slice(0,sorted.length),borderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,padding:8,font:{size:11}}}}}
    });
  }

  // Income pie
  const incPieCtx = document.getElementById('chart-income-type');
  if (incPieCtx) {
    const incomes = data.transactions.filter(t=>t.type==='income');
    const typeTotals = {};
    incomes.forEach(t => { typeTotals[t.incomeType||t.category] = (typeTotals[t.incomeType||t.category]||0) + t.amount; });
    const sorted = Object.entries(typeTotals).sort((a,b)=>b[1]-a[1]);
    const colors = ['#336B57','#4a9070','#22c55e','#14b8a6','#06b6d4','#3b82f6','#8b5cf6'];
    chartInstances.incPie = new Chart(incPieCtx, {
      type:'doughnut',
      data:{ labels:sorted.map(s=>s[0]), datasets:[{data:sorted.map(s=>s[1]),backgroundColor:colors.slice(0,sorted.length),borderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,padding:8,font:{size:11}}}}}
    });
  }
}

function getChartPeriods(mode) {
  const now = new Date();
  const periods = [];
  if (mode === 'week') {
    for (let i = 7; i >= 0; i--) {
      const start = new Date(now);
      start.setDate(start.getDate() - (i * 7) - start.getDay());
      start.setHours(0,0,0,0);
      const end = new Date(start);
      end.setDate(end.getDate() + 6);
      end.setHours(23,59,59,999);
      const label = (start.getDate()).toString().padStart(2,'0') + '/' + (start.getMonth()+1).toString().padStart(2,'0');
      periods.push({label, start:start.toISOString(), end:end.toISOString()});
    }
  } else {
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const end = new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59, 999);
      const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
      const label = months[d.getMonth()] + ' ' + d.getFullYear().toString().slice(2);
      periods.push({label, start:d.toISOString(), end:end.toISOString()});
    }
  }
  return periods;
}

function renderDebtsList() {
  if (!data.debts.length) return '<div class="empty-state" style="padding:20px"><p>No hay deudas registradas</p></div>';
  return data.debts.map(d => {
    const pct = d.totalAmount>0 ? Math.min(100,((d.paidAmount||0)/d.totalAmount)*100) : 0;
    const rem = d.totalAmount - (d.paidAmount||0);
    return `<div style="padding:12px 0;border-bottom:1px solid var(--border-l)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <strong>${d.name}</strong>${d.category?'<span style="font-size:11px;color:var(--primary-l);margin-left:6px;font-weight:400">'+d.category+'</span>':''}
        <div style="display:flex;gap:4px;align-items:center">
          <span class="debt-status ${d.status}">${d.status==='paid'?'Pagada':'Activa'}</span>
          <button class="btn btn-sm btn-danger" style="padding:4px 8px;font-size:11px" onclick="deleteDebt('${d.id}')">&#128465;</button>
        </div>
      </div>
      <div style="font-size:12px;color:var(--text-s);margin-bottom:4px">Total: ${fmtMoney(d.totalAmount,d.currency)} | Pagado: ${fmtMoney(d.paidAmount||0,d.currency)} | Pendiente: ${fmtMoney(rem,d.currency)}</div>
      <div class="progress-bar"><div class="progress-fill green" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

function deleteDebt(id) {
  showConfirm('Eliminar Deuda', 'Se eliminara la deuda y todos sus pagos asociados. No se puede deshacer.', function() {
    data.debts = data.debts.filter(d => d.id !== id);
    data.transactions = data.transactions.filter(t => t.debtId !== id);
    saveData();
    showToast('Deuda eliminada');
    renderCurrentView();
  });
}

/* ======== EXPORT / IMPORT ======== */
function exportJSON() {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'fnzs_acb_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(url);
  showToast('Datos exportados como JSON');
}

function exportCSV() {
  const headers = ['Fecha','Tipo','Categoria','Subcategoria','Monto','Moneda','Origen','Destino','Notas'];
  const rows = data.transactions.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(tx => {
    return [
      fmtDateTime(tx.date),
      TYPE_LABELS[tx.type]||tx.type,
      tx.category||'',
      tx.subcategory||'',
      tx.amount.toFixed(2),
      tx.currency,
      SOURCE_LABELS[tx.source]||tx.source||'',
      SOURCE_LABELS[tx.destination]||tx.destination||'',
      (tx.notes||'').replace(/"/g, '""')
    ].map(v => '"' + v + '"').join(',');
  });
  const csv = '\uFEFF' + headers.join(',') + '\r\n' + rows.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'fnzs_acb_transacciones_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(url);
  showToast('Transacciones exportadas como CSV');
}

function triggerImport() { document.getElementById('import-file').click(); }

function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported.transactions || !Array.isArray(imported.transactions)) {
        showToast('Formato de archivo invalido','error'); return;
      }
      if (!imported.debts || !Array.isArray(imported.debts)) imported.debts = [];
      if (!imported.settings) imported.settings = {darkMode:true};
      showConfirm('Importar Datos', 'Esto reemplazara TODOS los datos actuales con los datos del archivo. Continuar?', function() {
        data = imported;
        recalcBalances();
        saveData();
        applyTheme();
        showToast('Datos importados correctamente');
        renderCurrentView();
      });
    } catch(err) {
      showToast('Error al leer el archivo: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  input.value = '';
}
function importJSONFile(input) { importJSON(input); }

function resetAllData() {
  showConfirm('Borrar Todos los Datos', 'Esta accion eliminara permanentemente TODAS las transacciones, deudas y configuraciones. No se puede deshacer.', function() {
    data = { transactions:[], debts:[], settings:{darkMode:data.settings.darkMode}, balances:{debitoPEN:0,debitoUSD:0,efectivoPEN:0,efectivoUSD:0,ahorroPEN:0,ahorroUSD:0} };
    saveData();
    showToast('Todos los datos han sido eliminados');
    renderCurrentView();
  });
}
