.chart-box{background:var(--surface);border-radius:var(--radius);padding:16px;border:1px solid var(--border-l);margin-bottom:16px}
.chart-box h4{font-size:14px;font-weight:600;margin-bottom:12px}
.chart-container{position:relative;width:100%;max-height:280px}
.chart-filters{display:flex;gap:6px;margin-bottom:12px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-s)}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px;opacity:.5}
.empty-state p{font-size:14px}
.debt-item{padding:16px;margin-bottom:8px}
.debt-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.debt-name{font-weight:600;font-size:15px}
.debt-status{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.debt-status.active{background:var(--yellow-bg);color:var(--yellow)}
.debt-status.paid{background:var(--green-bg);color:var(--green)}
.debt-amounts{display:flex;justify-content:space-between;font-size:13px;color:var(--text-s);margin-bottom:8px}
.settings-section{margin-bottom:24px}
.settings-section h3{font-size:15px;font-weight:600;margin-bottom:12px}
.settings-item{padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.settings-item+.settings-item{border-top:1px solid var(--border-l)}
.confirm-overlay{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);backdrop-filter:blur(3px)}
.confirm-overlay.active{display:flex}
.confirm-box{background:var(--surface);border-radius:var(--radius);padding:24px;width:min(380px,90vw);text-align:center;box-shadow:var(--shadow-lg);animation:fadeIn .2s ease}
.confirm-box h4{font-size:16px;margin-bottom:8px}
.confirm-box p{font-size:14px;color:var(--text-s);margin-bottom:20px}
.confirm-actions{display:flex;gap:8px;justify-content:center}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@media(min-width:768px){
  .modal-content{border-radius:var(--radius);max-height:85vh;margin:auto}
  .modal-overlay{align-items:center}
  .cards-grid{grid-template-columns:repeat(4,1fr)}
  .views-container{padding-bottom:0}
  .view{padding:24px 32px;max-width:960px;margin:0 auto}
}
@media(min-width:1024px){.view{padding:28px 40px}.quick-actions{flex-wrap:nowrap}.action-btn{min-width:0}}
@media(max-width:370px){.cards-grid{grid-template-columns:1fr}.balance-card .card-amount{font-size:14px}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--text-xs)}
.tab-bar{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:var(--radius-sm);margin-bottom:16px}
.tab-btn{flex:1;padding:8px;border:none;background:none;border-radius:var(--radius-xs);font-size:13px;font-weight:500;color:var(--text-s);cursor:pointer;transition:all var(--transition)}
.tab-btn.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow);font-weight:600}
.amount-positive{color:var(--green)}.amount-negative{color:var(--red)}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-20{margin-bottom:20px}.mb-24{margin-bottom:24px}

<body>
<div id="pin-screen">
  <div class="pin-card">
    <div class="pin-logo">FNZS ACB</div>

    <div class="pin-input-wrap">
      <input type="password" id="pin-input" maxlength="8" inputmode="numeric" pattern="[0-9]*" placeholder="PIN" autocomplete="off">
    </div>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
      <span>Config</span>
    </button>
  </nav>
</div>
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-content" id="modal-content"></div>
</div>

  <div class="confirm-box" id="confirm-box"></div>
</div>
<div id="toast-container"></div>
<script>
'use strict';

/* ======== CONSTANTS ======== */
const PIN = '20111653';
const CATEGORIES_RAW = {
  'Transporte': ['Bus','Taxi','Metropolitano','Colectivo'],
  'Comida': ['Restaurante','PYA','Desayuno','Almuerzo/Menu','Postre/Snack'],
  'Mascotas': ['Arena','Comida','Veterinario','Pipetas','Panes con pollo'],
  'Alessandro': ['Mes','Propina','Ingles','Taller','Gustos','TM','Piano','Piscina','Psicólogo','Ropa','Tecnología'],
  'Deporte': ['Especifico','Suscripcion','Implementos'],
  'Servicios': ['Casa - Mobiliario/Mantenimiento','Casa - Gasto Fijo Mensual','Mes','Internet','Luz','Agua','Gas','Celular','Seguro de Vida'],
  'Ropa': [],
  'Tecnologia': [],
  'Cuidado Personal': ['Cabello','Piel','Carita','Pies'],
  'Limpieza': [],
  'Abarrotes': ['Mercado/Fruta-verdura','Panaderia','Snacks/Antojos','Despensa general'],
  'Entretenimiento': ['Cine','Juegos','Libros','Teatro','WeWe','Viajes/Escapadas','Streaming','TCG','PGO','Concierto']
};
const INCOME_TYPES_RAW = {
  'Sueldo': 'debito', 'Gratificacion': 'debito', 'Utilidades': 'debito',
  'Liquidacion': 'debito', 'Adicionales': null, 'Freelos': null, 'Prestamos': null,
  'CTS': null, 'Renta Alquiler': null, 'Agua Alquiler': null, 'Luz Alquiler': null
};
/* Listas ordenadas alfabéticamente (categorías, subcategorías y tipos de ingreso) */
const _esSort = (a,b) => a.localeCompare(b, 'es', {sensitivity:'base'});
const CATEGORIES = {};
Object.keys(CATEGORIES_RAW).sort(_esSort).forEach(c => { CATEGORIES[c] = CATEGORIES_RAW[c].slice().sort(_esSort); });
const INCOME_TYPES = {};
Object.keys(INCOME_TYPES_RAW).sort(_esSort).forEach(c => { INCOME_TYPES[c] = INCOME_TYPES_RAW[c]; });

const TYPE_LABELS = {
  income: 'Ingreso', expense: 'Egreso', cash_withdrawal: 'Retiro Efectivo',
  savings_in: 'Ahorro +', savings_out: 'Ahorro -', debt_payment: 'Pago Deuda'
};
const SOURCE_LABELS = { debito: 'Cuenta Debito', efectivo: 'Efectivo', ahorro: 'Ahorro' };
const DEBT_PAYMENT_METHODS = ['Tarjeta de Credito','Debito','Efectivo'];

/* ======== DATA ======== */
let data = { transactions: [], debts: [], settings: { darkMode: true }, balances: {
  debitoPEN:0, debitoUSD:0, efectivoPEN:0, efectivoUSD:0, ahorroPEN:0, ahorroUSD:0
}};
let currentView = 'home';
let txPage = 1;
const TX_PER_PAGE = 20;
let txFilters = { type:'all', category:'all', currency:'all', search:'', dateFrom:'', dateTo:'' };
let chartInstances = {};
let dashFilter = 'month';

function loadData() {
  try {
    const saved = localStorage.getItem('fnzs_acb_data');
    if (saved) { data = JSON.parse(saved); }
  } catch(e) { console.error('Load error:', e); }
  if (!data.balances) data.balances = {debitoPEN:0,debitoUSD:0,efectivoPEN:0,efectivoUSD:0,ahorroPEN:0,ahorroUSD:0};
  if (!data.transactions) data.transactions = [];
  if (!data.debts) data.debts = [];
  if (!data.settings) data.settings = {darkMode:true};
  if (!data.plan) data.plan = { periods:[], fixedRecurring:[], fixedScheduled:[], budgets:[] };
  if (!data.plan.periods) data.plan.periods = [];
  if (!data.plan.fixedRecurring) data.plan.fixedRecurring = [];
  if (!data.plan.fixedScheduled) data.plan.fixedScheduled = [];
  if (!data.plan.budgets) data.plan.budgets = [];
  data.plan.fixedRecurring.forEach(it => {
    if (!it.recurrencia) it.recurrencia = 'mensual';
    if (it.diaMes1 == null) it.diaMes1 = 1;
    if (it.diaMes2 === undefined) it.diaMes2 = null;
  });
}
function saveData() {
  recalcBalances();
  try { localStorage.setItem('fnzs_acb_data', JSON.stringify(data)); } catch(e) { console.error('Save error:', e); }
}
function recalcBalances() {
  const b = {debitoPEN:0,debitoUSD:0,efectivoPEN:0,efectivoUSD:0,ahorroPEN:0,ahorroUSD:0};
  data.transactions.forEach(tx => {
    const c = tx.currency;
    switch(tx.type) {
      case 'income':
        if (tx.destination === 'debito') b['debito'+c] += tx.amount;
        else if (tx.destination === 'efectivo') b['efectivo'+c] += tx.amount;
        break;
      case 'expense':
        if (tx.source === 'debito') b['debito'+c] -= tx.amount;
        else if (tx.source === 'efectivo') b['efectivo'+c] -= tx.amount;
        break;
      case 'cash_withdrawal':
        b['debito'+c] -= tx.amount;
        b['efectivo'+c] += tx.amount;
        break;
      case 'savings_in':
        if (tx.source === 'debito') b['debito'+c] -= tx.amount;
        else if (tx.source === 'efectivo') b['efectivo'+c] -= tx.amount;
        b['ahorro'+c] += tx.amount;
        break;
      case 'savings_out':
        b['ahorro'+c] -= tx.amount;
        if (tx.destination === 'debito') b['debito'+c] += tx.amount;
        else if (tx.destination === 'efectivo') b['efectivo'+c] += tx.amount;
        break;
      case 'debt_payment':
        if (tx.source === 'debito') b['debito'+c] -= tx.amount;
        else if (tx.source === 'efectivo') b['efectivo'+c] -= tx.amount;
        else if (tx.source === 'ahorro') b['ahorro'+c] -= tx.amount;
        break;
    }
  });
  data.balances = b;
  // Recalc debt paid amounts
  data.debts.forEach(d => {
    d.paidAmount = data.transactions
      .filter(tx => tx.type === 'debt_payment' && tx.debtId === d.id)
      .reduce((sum, tx) => sum + tx.amount, 0);
    d.status = d.paidAmount >= d.totalAmount ? 'paid' : 'active';
  });
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }
function fmtMoney(amount, currency) {
  const sym = currency === 'USD' ? '$ ' : 'S/ ';
  const sign = amount < 0 ? '-' : '';
  return sign + sym + Math.abs(amount).toLocaleString('es-PE', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(d) {
  const dt = new Date(d);
  return dt.toLocaleDateString('es-PE', {day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtDateTime(d) {
  const dt = new Date(d);
  return dt.toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' +
         dt.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',hour12:false});
}
function nowISO() {
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off * 60000);
  return local.toISOString().slice(0, 16);
}
function showToast(msg, type) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast toast-' + (type || 'success');
  const icons = {success:'\u2705', error:'\u274C', info:'\u2139\uFE0F'};
  t.innerHTML = (icons[type] || icons.success) + ' ' + msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(100%)'; t.style.transition = '.3s ease'; setTimeout(() => t.remove(), 300); }, 3000);
}
function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('active');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
}
function showConfirm(title, msg, onYes) {
  const box = document.getElementById('confirm-box');
  box.innerHTML = '<h4>' + title + '</h4><p>' + msg + '</p><div class="confirm-actions"><button class="btn btn-secondary" onclick="hideConfirm()">Cancelar</button><button class="btn btn-danger" id="confirm-yes-btn">Eliminar</button></div>';
  document.getElementById('confirm-overlay').classList.add('active');
  document.getElementById('confirm-yes-btn').onclick = function() { hideConfirm(); onYes(); };
}
function hideConfirm() { document.getElementById('confirm-overlay').classList.remove('active'); }

/* ======== PIN ======== */
function checkPin() {
  const input = document.getElementById('pin-input');
  const err = document.getElementById('pin-error');
  if (input.value === PIN) {
    document.getElementById('pin-screen').style.display = 'none';
    document.getElementById('app').classList.add('active');
    renderCurrentView();
  } else {
    err.textContent = 'PIN incorrecto';
    input.classList.add('shake');
    setTimeout(() => input.classList.remove('shake'), 500);
    input.value = '';
    input.focus();
  }
}
document.addEventListener('DOMContentLoaded', function() {
  const pinInput = document.getElementById('pin-input');
  pinInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') checkPin(); });
  pinInput.focus();
});

/* ======== NAVIGATION ======== */
function navigateTo(view) {
  currentView = view;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.getElementById('views-container').scrollTop = 0;
  renderCurrentView();
}
function renderCurrentView() {
  switch(currentView) {
    case 'home': renderHome(); break;
    case 'transactions': renderTransactions(); break;
    case 'dashboard': renderDashboard(); break;
    case 'plan': renderPlan(); break;
    case 'settings': renderSettings(); break;
  }
}
function toggleDarkMode() { /* Dark mode is always on */ }
function applyTheme() {
  document.documentElement.setAttribute('data-theme', 'dark');
}

/* ======== HOME ======== */
function renderHome() {
  const b = data.balances;
  const totalDebtPEN = data.debts.filter(d=>d.currency==='PEN'&&d.status==='active').reduce((s,d)=>s+(d.totalAmount-(d.paidAmount||0)),0);
  const totalDebtUSD = data.debts.filter(d=>d.currency==='USD'&&d.status==='active').reduce((s,d)=>s+(d.totalAmount-(d.paidAmount||0)),0);
  document.getElementById('view-home').innerHTML = `
    <div class="cards-grid">
      <div class="card balance-card debito">
        <div class="card-icon">&#128179;</div>
        <div class="card-label">Cuenta Debito</div>
        <div class="card-amount pen">${fmtMoney(b.debitoPEN,'PEN')}</div>
        <div class="card-amount usd">${fmtMoney(b.debitoUSD,'USD')}</div>
      </div>
      <div class="card balance-card efectivo">
        <div class="card-icon">&#128181;</div>
        <div class="card-label">Efectivo</div>
        <div class="card-amount pen">${fmtMoney(b.efectivoPEN,'PEN')}</div>
        <div class="card-amount usd">${fmtMoney(b.efectivoUSD,'USD')}</div>
      </div>
      <div class="card balance-card ahorro">
        <div class="card-icon">&#127974;</div>
        <div class="card-label">Fondo de Ahorro</div>
        <div class="card-amount pen">${fmtMoney(b.ahorroPEN,'PEN')}</div>
        <div class="card-amount usd">${fmtMoney(b.ahorroUSD,'USD')}</div>
      </div>
      <div class="card balance-card deuda">
        <div class="card-icon">&#128200;</div>
        <div class="card-label">Deudas Pendientes</div>
        <div class="card-amount pen" style="color:var(--red)">${fmtMoney(totalDebtPEN,'PEN')}</div>
        <div class="card-amount usd" style="color:var(--red)">${fmtMoney(totalDebtUSD,'USD')}</div>
      </div>
    </div>
    <div class="section-title">Acciones Rapidas</div>
    <div class="quick-actions">
      <div class="action-btn" onclick="showIncomeForm()">
        <div class="action-icon income">+</div>
        <div class="action-label">Registrar Ingreso</div>
      </div>
      <div class="action-btn" onclick="showExpenseForm()">
        <div class="action-icon expense">&minus;</div>
        <div class="action-label">Registrar Egreso</div>
      </div>
      <div class="action-btn" onclick="showPayDebtForm()">
        <div class="action-icon debt">&#128176;</div>
        <div class="action-label">Pagar Deuda</div>
      </div>
      <div class="action-btn" onclick="showSavingsForm()">
        <div class="action-icon savings">&#128178;</div>
        <div class="action-label">Mover Ahorro</div>
      </div>
      <div class="action-btn" onclick="navigateTo('dashboard')">
        <div class="action-icon dashboard">&#128202;</div>
        <div class="action-label">Dashboard</div>
      </div>
    </div>
    <div class="section-title" style="margin-top:4px">Sincronizar Datos</div>
    <div style="display:flex;gap:6px;margin-bottom:20px">
      <button class="btn btn-secondary" style="flex:1;min-width:0;font-size:11px;padding:10px 6px" onclick="exportJSON()">&#128229; Respaldo</button>
      <button class="btn btn-secondary" style="flex:1;min-width:0;font-size:11px;padding:10px 6px" onclick="document.getElementById('import-home-input').click()">&#128228; Importar</button>
      <button class="btn btn-secondary" style="flex:1;min-width:0;font-size:11px;padding:10px 6px" onclick="exportCSV()">&#128196; CSV</button>
      <input type="file" id="import-home-input" accept=".json" style="display:none" onchange="importJSONFile(this)">
    </div>
    ${renderRecentTx()}
    ${renderActiveDebts()}
  `;
}
function renderRecentTx() {
  const recent = data.transactions.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);
  if (!recent.length) return '<div class="empty-state"><div class="empty-icon">&#128203;</div><p>No hay movimientos registrados aun.<br>Usa las acciones rapidas para comenzar.</p></div>';
  let rows = recent.map(tx => {
    const isNeg = ['expense','cash_withdrawal','savings_in','debt_payment'].includes(tx.type);
    const sign = isNeg ? '-' : '+';
    const cls = isNeg ? 'amount-negative' : 'amount-positive';
    const label = tx.type === 'expense' ? (tx.category || '') : (TYPE_LABELS[tx.type] || '');
    return `<tr>
      <td style="white-space:nowrap">${fmtDate(tx.date)}</td>
      <td><span class="type-badge ${tx.type}">${TYPE_LABELS[tx.type]}</span></td>
      <td>${label}${tx.subcategory ? ' / '+tx.subcategory : ''}</td>
      <td class="${cls}" style="font-weight:600;white-space:nowrap">${sign} ${fmtMoney(tx.amount,tx.currency)}</td>
    </tr>`;
  }).join('');
  return `<div class="section-title" style="margin-top:8px">Movimientos Recientes</div>
    <div class="table-wrap card" style="padding:0"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th>Monto</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function renderActiveDebts() {
  const active = data.debts.filter(d => d.status === 'active');
  if (!active.length) return '';
  let items = active.map(d => {
    const remaining = d.totalAmount - (d.paidAmount||0);
    const pct = d.totalAmount > 0 ? Math.min(100, ((d.paidAmount||0)/d.totalAmount)*100) : 0;
    return `<div class="card debt-item">
      <div class="debt-header"><span class="debt-name">${d.name}${d.category?' <span style="font-size:11px;color:var(--primary-l);font-weight:400">('+d.category+')</span>':''}</span><span class="debt-status active">Activa</span></div>
      <div class="debt-amounts"><span>Pagado: ${fmtMoney(d.paidAmount||0,d.currency)}</span><span>Pendiente: ${fmtMoney(remaining,d.currency)}</span></div>
      <div class="progress-bar"><div class="progress-fill green" style="width:${pct}%"></div></div>
      <div style="font-size:11px;color:var(--text-xs);text-align:right">${pct.toFixed(1)}% completado</div>
    </div>`;
  }).join('');
  return `<div class="section-title" style="margin-top:16px">Deudas Activas</div>${items}`;
}

function toggleDebtAmount(checkbox) {
  const id = checkbox.value;
  const row = document.getElementById('debt-amt-'+id);
  row.style.display = checkbox.checked ? 'block' : 'none';
  if (!checkbox.checked) { const inp = row.querySelector('input'); if(inp) inp.value=''; }
  updatePayTotal();
}
function updatePayTotal() {
  const inputs = document.querySelectorAll('.debt-pay-input');
  let totals = {};
  inputs.forEach(inp => {
    const v = parseFloat(inp.value) || 0;
    if (v > 0) {
      const dId = inp.getAttribute('data-debt-id');
      const debt = data.debts.find(d=>d.id===dId);
      if (debt) { totals[debt.currency] = (totals[debt.currency]||0) + v; }
    }
  });
  const summary = document.getElementById('pay-total-summary');
  const totalEl = document.getElementById('pay-total-amount');
  const parts = Object.entries(totals).map(([c,v])=>fmtMoney(v,c)).join(' + ');
  if (parts) { summary.style.display='block'; totalEl.textContent=parts; }
  else { summary.style.display='none'; }
}
function saveMultiPayDebt() {
  const checks = document.querySelectorAll('.debt-check:checked');
  if (!checks.length) { showToast('Selecciona al menos una deuda','error'); return; }
  const source = document.getElementById('pay-source').value;
  const date = document.getElementById('pay-date').value;
  const notes = document.getElementById('pay-notes').value.trim();
  let count = 0;
  checks.forEach(chk => {
    const dId = chk.value;
    const inp = document.querySelector('.debt-pay-input[data-debt-id="'+dId+'"]');
    const amount = parseFloat(inp ? inp.value : 0);
    if (!amount || amount<=0) return;
    const debt = data.debts.find(d=>d.id===dId);
    if (!debt) return;
    data.transactions.push({
      id:genId(), type:'debt_payment', amount, currency:debt.currency,
      source, destination:null, category:debt.category||'Pago Deuda', subcategory:debt.subcategory||debt.name,
      incomeType:null, debtId:dId, date, notes:notes||(debt.name+' - '+(debt.method||'')), createdAt:new Date().toISOString()
    });
    count++;
  });
  if (!count) { showToast('Ingresa montos validos en las deudas seleccionadas','error'); return; }
  saveData(); closeModal();
  showToast(count===1?'Pago de deuda registrado':count+' pagos de deuda registrados');
  renderCurrentView();
}
function savePayDebt(editId) {
  const debtId = document.getElementById('pay-debt').value;
  const amount = parseFloat(document.getElementById('pay-amount').value);
  const source = document.getElementById('pay-source').value;
  const date = document.getElementById('pay-date').value;
  const notes = document.getElementById('pay-notes').value.trim();
  if (!amount || amount <= 0) { showToast('Ingresa un monto valido','error'); return; }
  const debt = data.debts.find(d => d.id === debtId);
  if (!debt) { showToast('Deuda no encontrada','error'); return; }
  const tx = {
    id: editId || genId(), type:'debt_payment', amount, currency:debt.currency,
    source, destination:null, category:debt.category||'Pago Deuda', subcategory:debt.subcategory||debt.name,
    incomeType:null, debtId, date, notes:notes||(debt.name+' - '+debt.method), createdAt: editId ? undefined : new Date().toISOString()
  };
  if (editId) {
    const idx = data.transactions.findIndex(t=>t.id===editId);
    if (idx>=0) { tx.createdAt = data.transactions[idx].createdAt; data.transactions[idx] = tx; }
  } else { data.transactions.push(tx); }
  saveData(); closeModal();
  showToast(editId ? 'Pago actualizado' : 'Pago de deuda registrado');
  renderCurrentView();
}

function setSavType(t) {
  window._savType = t;
  document.querySelectorAll('#sav-type-bar .tab-btn').forEach((b,i) => b.classList.toggle('active', (i===0&&t==='in')||(i===1&&t==='out')));
  document.getElementById('sav-loc-label').textContent = (t==='in'?'Origen':'Destino') + ' *';
  document.getElementById('sav-cat-wrap').style.display = t==='out'?'block':'none';
}
function onSavCatChange(preselect) {
  const cat = document.getElementById('sav-category').value;
  const subSel = document.getElementById('sav-subcategory');
  const subs = CATEGORIES[cat] || [];
  subSel.innerHTML = '<option value="">Sin subcategoria</option>' + subs.map(s => '<option value="'+s+'" '+(preselect===s?'selected':'')+'>'+s+'</option>').join('');
  document.getElementById('sav-subcat-wrap').style.display = subs.length ? 'block' : 'none';
}
function saveSavings(editId) {
  const amount = parseFloat(document.getElementById('sav-amount').value);
  const currency = document.getElementById('sav-currency').value;
  const loc = document.getElementById('sav-location').value;
  const date = document.getElementById('sav-date').value;
  const notes = document.getElementById('sav-notes').value.trim();
  const isIn = window._savType === 'in';
  if (!amount || amount <= 0) { showToast('Ingresa un monto valido','error'); return; }
  const tx = {
    id: editId || genId(), type: isIn?'savings_in':'savings_out', amount, currency,
    source: isIn?loc:'ahorro', destination: isIn?'ahorro':loc,
    category: isIn?'Ahorro +':(document.getElementById('sav-category')?document.getElementById('sav-category').value:'Ahorro -'),
    subcategory: isIn?null:(document.getElementById('sav-subcategory')?document.getElementById('sav-subcategory').value||null:null),
    incomeType:null, debtId:null,
    date, notes, createdAt: editId ? undefined : new Date().toISOString()
  };
  if (editId) {
    const idx = data.transactions.findIndex(t=>t.id===editId);
    if (idx>=0) { tx.createdAt = data.transactions[idx].createdAt; data.transactions[idx] = tx; }
  } else { data.transactions.push(tx); }
  saveData(); closeModal();
  showToast(editId ? 'Movimiento actualizado' : (isIn ? 'Ahorro agregado' : 'Retiro de ahorro registrado'));
  renderCurrentView();
}

/* ======== EDIT / DELETE ======== */
function editTransaction(id) {
  const tx = data.transactions.find(t => t.id === id);
  if (!tx) return;
  closeModal();
  setTimeout(() => {
    switch(tx.type) {
      case 'income': showIncomeForm(tx); break;
      case 'expense': showExpenseForm(tx); break;
      case 'cash_withdrawal': showExpenseForm({...tx, source:'retiro'}); break;
      case 'savings_in': case 'savings_out': showSavingsForm(tx); break;
      case 'debt_payment': showPayDebtForm(tx); break;
    }
  }, 100);
}
function deleteTransaction(id) {
  const tx = data.transactions.find(t => t.id === id);
  if (!tx) return;
  showConfirm('Eliminar Movimiento',
    'Esta accion eliminara este movimiento y recalculara todos los saldos. No se puede deshacer.',
    function() {
      data.transactions = data.transactions.filter(t => t.id !== id);
      saveData();
      showToast('Movimiento eliminado');
      renderCurrentView();
    });
}

function renderTransactions() {
  const allTypes = [...new Set(data.transactions.map(t=>t.type))];
  const allCats = [...new Set(data.transactions.filter(t=>t.category).map(t=>t.category))].sort();
  const typeFilterOpts = '<option value="all">Todos</option>' + allTypes.map(t => `<option value="${t}" ${txFilters.type===t?'selected':''}>${TYPE_LABELS[t]||t}</option>`).join('');
  const catFilterOpts = '<option value="all">Todas</option>' + allCats.map(c => `<option value="${c}" ${txFilters.category===c?'selected':''}>${c}</option>`).join('');

  let filtered = data.transactions.slice();
  if (txFilters.type !== 'all') filtered = filtered.filter(t => t.type === txFilters.type);
  if (txFilters.category !== 'all') filtered = filtered.filter(t => t.category === txFilters.category);
  if (txFilters.currency !== 'all') filtered = filtered.filter(t => t.currency === txFilters.currency);
  if (txFilters.dateFrom) filtered = filtered.filter(t => t.date >= txFilters.dateFrom);
  if (txFilters.dateTo) filtered = filtered.filter(t => t.date <= txFilters.dateTo + 'T23:59:59');
  if (txFilters.search) {
    const s = txFilters.search.toLowerCase();
    filtered = filtered.filter(t =>
      (t.category||'').toLowerCase().includes(s) ||
      (t.subcategory||'').toLowerCase().includes(s) ||
      (t.notes||'').toLowerCase().includes(s) ||
      (t.incomeType||'').toLowerCase().includes(s) ||
      (TYPE_LABELS[t.type]||'').toLowerCase().includes(s)
    );
  }
  filtered.sort((a,b) => new Date(b.date) - new Date(a.date));
  const totalPages = Math.max(1, Math.ceil(filtered.length / TX_PER_PAGE));
  if (txPage > totalPages) txPage = totalPages;
  const start = (txPage - 1) * TX_PER_PAGE;
  const page = filtered.slice(start, start + TX_PER_PAGE);

  let tableRows = '';
  if (page.length === 0) {
    tableRows = '<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--text-s)">No se encontraron movimientos</td></tr>';
  } else {
    tableRows = page.map(tx => {
      const isNeg = ['expense','cash_withdrawal','savings_in','debt_payment'].includes(tx.type);
      const sign = isNeg ? '-' : '+';

                     tx.type==='savings_in' ? (SOURCE_LABELS[tx.source]||'') + ' → Ahorro' :
                     tx.type==='savings_out' ? 'Ahorro → ' + (SOURCE_LABELS[tx.destination]||'') :
                     tx.type==='debt_payment' ? (SOURCE_LABELS[tx.source]||'') + ' → Deuda' :
                     tx.type==='income' ? '→ ' + (SOURCE_LABELS[tx.destination]||'') :
                     (SOURCE_LABELS[tx.source]||'');

        <td style="white-space:nowrap">${fmtDateTime(tx.date)}</td>
        <td><span class="type-badge ${tx.type}">${TYPE_LABELS[tx.type]}</span></td>
        <td>${tx.category||'-'}${tx.subcategory?' / '+tx.subcategory:''}</td>
        <td class="${cls}" style="font-weight:600;white-space:nowrap">${sign} ${fmtMoney(tx.amount,tx.currency)}</td>
        <td>${tx.currency}</td>
        <td style="font-size:12px">${srcDst}</td>
        <td style="font-size:12px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(tx.notes||'').replace(/"/g,'&quot;')}">${tx.notes||'-'}</td>
        <td><div class="row-actions"><button class="edit-btn" onclick="editTransaction('${tx.id}')" title="Editar">&#9998;</button><button class="del-btn" onclick="deleteTransaction('${tx.id}')" title="Eliminar">&#128465;</button></div></td>
      </tr>`;
    }).join('');
  }

  document.getElementById('view-transactions').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="font-size:20px;font-weight:700">Movimientos</h2>
      <span style="font-size:13px;color:var(--text-s)">${filtered.length} registro${filtered.length!==1?'s':''}</span>
    </div>
    <div class="filters-bar">
      <div class="search-wrap"><span class="search-icon">&#128269;</span><input class="search-input" placeholder="Buscar..." value="${txFilters.search}" oninput="txFilters.search=this.value;txPage=1;renderTransactions()"></div>
      <select class="filter-select" onchange="txFilters.type=this.value;txPage=1;renderTransactions()">${typeFilterOpts}</select>
      <select class="filter-select" onchange="txFilters.category=this.value;txPage=1;renderTransactions()">${catFilterOpts}</select>
      <select class="filter-select" onchange="txFilters.currency=this.value;txPage=1;renderTransactions()">
        <option value="all" ${txFilters.currency==='all'?'selected':''}>PEN+USD</option>
        <option value="PEN" ${txFilters.currency==='PEN'?'selected':''}>PEN</option>
        <option value="USD" ${txFilters.currency==='USD'?'selected':''}>USD</option>
      </select>
      <input type="date" class="filter-select" value="${txFilters.dateFrom}" onchange="txFilters.dateFrom=this.value;txPage=1;renderTransactions()" title="Desde">
      <input type="date" class="filter-select" value="${txFilters.dateTo}" onchange="txFilters.dateTo=this.value;txPage=1;renderTransactions()" title="Hasta">
    </div>

        <tbody>${tableRows}</tbody>

      <button class="btn btn-sm btn-secondary" onclick="txPage=Math.max(1,txPage-1);renderTransactions()" ${txPage<=1?'disabled':''}>&#8592; Anterior</button>

  // Income vs Expense bar chart

  if (barCtx) {

    periods.forEach(p => {
      labels.push(p.label);

      incomeData.push(txInPeriod.filter(t=>t.type==='income'&&t.currency==='PEN').reduce((s,t)=>s+t.amount,0));
      expenseData.push(txInPeriod.filter(t=>t.type==='expense'&&t.currency==='PEN').reduce((s,t)=>s+t.amount,0));

    chartInstances.bar = new Chart(barCtx, {
      type:'bar',
      data:{ labels, datasets:[

      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,padding:16}}},
        scales:{x:{grid:{display:false}},y:{grid:{color:gridColor},beginAtZero:true}}}

  // Expense pie

  if (pieCtx) {

    chartInstances.pie = new Chart(pieCtx, {

      data:{ labels:sorted.map(s=>s[0]), datasets:[{data:sorted.map(s=>s[1]),backgroundColor:colors.slice(0,sorted.length),borderWidth:0}]},

    });

  // Income pie

      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,padding:8,font:{size:11}}}}}
    });
  }
}

function getChartPeriods(mode) {
  const now = new Date();
  const periods = [];
  if (mode === 'week') {
    for (let i = 7; i >= 0; i--) {
      const start = new Date(now);
      start.setDate(start.getDate() - (i * 7) - start.getDay());
      start.setHours(0,0,0,0);
      const end = new Date(start);
      end.setDate(end.getDate() + 6);
      end.setHours(23,59,59,999);
      const label = (start.getDate()).toString().padStart(2,'0') + '/' + (start.getMonth()+1).toString().padStart(2,'0');
      periods.push({label, start:start.toISOString(), end:end.toISOString()});
    }
  } else {
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const end = new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59, 999);
      const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
      const label = months[d.getMonth()] + ' ' + d.getFullYear().toString().slice(2);
      periods.push({label, start:d.toISOString(), end:end.toISOString()});
    }
  }
  return periods;
}

  a.href = url; a.download = 'fnzs_acb_backup_' + new Date().toISOString().slice(0,10) + '.json';

      SOURCE_LABELS[tx.destination]||tx.destination||'',
      (tx.notes||'').replace(/"/g, '""')
    ].map(v => '"' + v + '"').join(',');
  });
  const csv = '\uFEFF' + headers.join(',') + '\r\n' + rows.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'fnzs_acb_transacciones_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(url);
  showToast('Transacciones exportadas como CSV');
}

function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported.transactions || !Array.isArray(imported.transactions)) {
        showToast('Formato de archivo invalido','error'); return;
      }
      if (!imported.debts || !Array.isArray(imported.debts)) imported.debts = [];
      if (!imported.settings) imported.settings = {darkMode:true};
      if (!imported.plan) imported.plan = { periods:[], fixedRecurring:[], fixedScheduled:[], budgets:[] };
      if (!imported.plan.periods) imported.plan.periods = [];
      if (!imported.plan.fixedRecurring) imported.plan.fixedRecurring = [];
      if (!imported.plan.fixedScheduled) imported.plan.fixedScheduled = [];
      if (!imported.plan.budgets) imported.plan.budgets = [];
      showConfirm('Importar Datos', 'Esto reemplazara TODOS los datos actuales con los datos del archivo. Continuar?', function() {
        data = imported;
        recalcBalances();
        saveData();
        applyTheme();
        showToast('Datos importados correctamente');
        renderCurrentView();
      });
    } catch(err) {
      showToast('Error al leer el archivo: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

/* ======== PLAN MENSUAL: MIGRATION ======== */
function migrateCategoriesV2() {
  if (data.settings && data.settings.migratedCategoriesV2) return;
  const has = (notes, arr) => {
    const n = (notes || '').toLowerCase();
    return arr.some(k => n.includes(k));
  };
  (data.transactions || []).forEach(tx => {
    if (tx.type !== 'expense') return;
    // Comida > Menu -> Desayuno / Almuerzo-Menu
    if (tx.category === 'Comida' && tx.subcategory === 'Menu') {
      tx.subcategory = has(tx.notes, ['desayuno']) ? 'Desayuno' : 'Almuerzo/Menu';
    }
    // Comida empty subcat + snack/dessert hints -> Postre/Snack
    else if (tx.category === 'Comida' && (!tx.subcategory) &&
             has(tx.notes, ['turron','turrón','gusto','postre','snack'])) {
      tx.subcategory = 'Postre/Snack';
    }
    // Servicios > Internet + youtube -> Entretenimiento > Streaming
    if (tx.category === 'Servicios' && tx.subcategory === 'Internet' && has(tx.notes, ['youtube'])) {
      tx.category = 'Entretenimiento';
      tx.subcategory = 'Streaming';
    }
    // Entretenimiento empty subcat heuristics
    if (tx.category === 'Entretenimiento' && (!tx.subcategory)) {
      if (has(tx.notes, ['paracas','viaje'])) tx.subcategory = 'Viajes/Escapadas';
      else if (has(tx.notes, ['youtube'])) tx.subcategory = 'Streaming';
      else if (has(tx.notes, ['pgo','pokemon go','pogo'])) tx.subcategory = 'Juegos';
    }
    // Servicios > Casa -> split
    if (tx.category === 'Servicios' && tx.subcategory === 'Casa') {
      if ((tx.amount >= 500) || has(tx.notes, ['cortina','mueble','mobiliario'])) {
        tx.subcategory = 'Casa - Mobiliario/Mantenimiento';
      } else {
        tx.subcategory = 'Casa - Gasto Fijo Mensual';
      }
    }
  });
  if (!data.settings) data.settings = {};
  data.settings.migratedCategoriesV2 = true;
  saveData();
}

let planSelectedPeriodId = null;
let planFilter = { years: [new Date().getFullYear()], months: [new Date().getMonth()+1] };

const MONTH_NAMES_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function getTxYears() {
  const set = new Set();
  (data.transactions || []).forEach(t => {
    const ys = (t.date || '').slice(0,4);
    if (ys) { const y = parseInt(ys,10); if (!isNaN(y)) set.add(y); }
  });
  set.add(new Date().getFullYear());
  return Array.from(set).sort((a,b)=>a-b);
}

function lastDayOfMonth(year, month) { return new Date(year, month, 0).getDate(); }

function monthRefDate(year, month, day) {
  const ld = lastDayOfMonth(year, month);
  const d = Math.min(Math.max(1, day||1), ld);
  return year + '-' + String(month).padStart(2,'0') + '-' + String(d).padStart(2,'0');
}

function recurrenceDays(it) {
  if (it && it.recurrencia === 'quincenal') {
    return [it.diaMes1 || 15, it.diaMes2 || 30];
  }
  return [(it && it.diaMes1) || 1];
}

function getPlanMonthRanges() {
  const ranges = [];
  const years = (planFilter.years || []).slice().sort((a,b)=>a-b);
  const months = (planFilter.months || []).slice().sort((a,b)=>a-b);
  years.forEach(y => {
    months.forEach(m => {
      const startD = y + '-' + String(m).padStart(2,'0') + '-01';
      const endD = y + '-' + String(m).padStart(2,'0') + '-' + String(lastDayOfMonth(y,m)).padStart(2,'0');
      ranges.push({ year:y, month:m, startD, endD });
    });
  });
  return ranges;
}

function togglePlanYear(y) {
  y = parseInt(y,10);
  const i = planFilter.years.indexOf(y);
  if (i>=0) planFilter.years.splice(i,1); else planFilter.years.push(y);
  renderPlan();
}
function togglePlanMonth(m) {
  m = parseInt(m,10);
  const i = planFilter.months.indexOf(m);
  if (i>=0) planFilter.months.splice(i,1); else planFilter.months.push(m);
  renderPlan();
}

function getFixedAmountAtDate(item, date) {
  // date: 'YYYY-MM-DD' string
  if (!item) return null;
  if (item.active === false && item.deletedFrom && date >= item.deletedFrom) return null;
  const versions = (item.versions || []).slice().sort((a,b) => (a.validFrom < b.validFrom ? -1 : 1));
  let chosen = null;
  versions.forEach(v => { if (v.validFrom <= date) chosen = v; });
  return chosen; // {amount, currency, validFrom, createdAt} or null
}

function todayStr() { return new Date().toISOString().slice(0,10); }

function renderPlanTracking(ranges) {
  if (!ranges || !ranges.length) {
    return '<div class="empty-state" style="padding:16px"><p>Selecciona al menos un año y un mes.</p></div>';
  }

  // Collect real transactions within ANY selected month-range (date part)
  const txs = data.transactions.filter(t => {
    if (!(t.type === 'income' || t.type === 'expense')) return false;
    const d = (t.date||'').slice(0,10);
    return ranges.some(r => d >= r.startD && d <= r.endD);
  });

  // Build category aggregation: { 'income'|'expense' : { cat : {planned:{PEN,USD}, real:{PEN,USD}} } }
  const agg = { income:{}, expense:{} };
  function ensure(type, cat) {
    if (!agg[type][cat]) agg[type][cat] = { planned:{PEN:0,USD:0}, real:{PEN:0,USD:0} };
    return agg[type][cat];
  }

  // Planned: fixed recurring projected for each selected (year,month). A 'mensual'
  // item contributes its current-version amount once per month; a 'quincenal' item
  // contributes it twice per month (one per dia de quincena). Version in effect is
  // evaluated at each occurrence's day-of-month within that month.
  ranges.forEach(r => {
    data.plan.fixedRecurring.forEach(it => {
      const days = recurrenceDays(it);
      days.forEach(dom => {
        const refDate = monthRefDate(r.year, r.month, dom);
        const v = getFixedAmountAtDate(it, refDate);
        if (!v) return;
        const cat = it.category || '(Sin categoría)';
        const cell = ensure(it.type, cat);
        cell.planned[v.currency] += v.amount;
      });
    });
  });
  // Planned: fixed scheduled whose expectedDate within ANY selected month-range
  data.plan.fixedScheduled.forEach(it => {
    if (ranges.some(r => it.expectedDate >= r.startD && it.expectedDate <= r.endD)) {
      const cat = it.category || '(Sin categoría)';
      const cell = ensure(it.type, cat);
      cell.planned[it.currency] += it.amount;
    }
  });
  // Real: actual transactions
  txs.forEach(t => {
    const cat = t.category || '(Sin categoría)';
    const cell = ensure(t.type, cat);
    cell.real[t.currency] += t.amount;
  });

  const totals = {
    planned:{PEN:0,USD:0}, real:{PEN:0,USD:0},
    incPlanned:{PEN:0,USD:0}, incReal:{PEN:0,USD:0},
    expPlanned:{PEN:0,USD:0}, expReal:{PEN:0,USD:0}
  };

  function budgetFor(cat) {
    return data.plan.budgets.find(b => b.category === cat);
  }

  function buildSubTable(type, title) {
    const cats = Object.keys(agg[type]).sort();
    if (!cats.length) return `<div style="font-size:12px;color:var(--text-s);margin:8px 0">${title}: sin datos</div>`;
    let rows = cats.map(cat => {
      const c = agg[type][cat];
      // accumulate totals
      ['PEN','USD'].forEach(cur => {
        totals.planned[cur] += (type==='income'? c.planned[cur] : 0);
      });
      if (type==='income') {
        totals.incPlanned.PEN += c.planned.PEN; totals.incPlanned.USD += c.planned.USD;
        totals.incReal.PEN += c.real.PEN; totals.incReal.USD += c.real.USD;
      } else {
        totals.expPlanned.PEN += c.planned.PEN; totals.expPlanned.USD += c.planned.USD;
        totals.expReal.PEN += c.real.PEN; totals.expReal.USD += c.real.USD;
      }
      // diff per currency
      function diffTxt(cur) {
        const d = c.planned[cur] - c.real[cur];
        if (c.planned[cur] === 0 && c.real[cur] === 0) return '';
        return fmtMoney(d, cur);
      }
      function amtTxt(obj) {
        const parts = [];
        if (obj.PEN) parts.push(fmtMoney(obj.PEN,'PEN'));
        if (obj.USD) parts.push(fmtMoney(obj.USD,'USD'));
        return parts.length ? parts.join('<br>') : '—';
      }
      // budget progress (only expense categories with a budget)
      let prog = '';
      const bud = budgetFor(cat);
      if (bud) {
        const real = c.real[bud.currency] || 0;
        const pct = bud.limitAmount > 0 ? (real / bud.limitAmount) * 100 : 0;
        let color = 'green';
        if (pct >= 100) color = 'red'; else if (pct >= 80) color = 'yellow';
        const fillColor = color==='red'?'var(--red)':color==='yellow'?'var(--yellow)':'var(--primary)';
        prog = `<div class="progress-bar" style="margin-bottom:4px"><div class="progress-fill" style="width:${Math.min(100,pct)}%;background:${fillColor}"></div></div>
          <div style="font-size:11px;color:var(--text-xs)">${fmtMoney(real,bud.currency)} / ${fmtMoney(bud.limitAmount,bud.currency)} (${pct.toFixed(0)}%)</div>`;
      } else {
        prog = '<span style="font-size:11px;color:var(--text-xs)">—</span>';
      }
      const diffParts = [];
      const dp = diffTxt('PEN'); const du = diffTxt('USD');
      if (dp) diffParts.push(dp); if (du) diffParts.push(du);
      return `<tr>
        <td>${cat}</td>
        <td style="white-space:nowrap">${amtTxt(c.planned)}</td>
        <td style="white-space:nowrap">${amtTxt(c.real)}</td>
        <td style="white-space:nowrap">${diffParts.length?diffParts.join('<br>'):'—'}</td>
        <td style="min-width:120px">${prog}</td>
      </tr>`;
    }).join('');
    return `<div style="font-weight:600;font-size:13px;margin:12px 0 6px">${title}</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Categoría</th><th>Planificado</th><th>Real</th><th>Diferencia</th><th>Progreso</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  }

  const incTable = buildSubTable('income', 'Ingresos');
  const expTable = buildSubTable('expense', 'Egresos');

  function sumRow(label, inc, exp) {
    return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-l);font-size:13px">
      <span>${label}</span>
      <span style="font-weight:600;text-align:right">
        PEN: ${fmtMoney(inc.PEN - exp.PEN, 'PEN')} &nbsp;|&nbsp; USD: ${fmtMoney(inc.USD - exp.USD, 'USD')}
      </span>
    </div>`;
  }

  const summary = `<div class="card mb-16" style="margin-top:4px">
    <div class="section-title">Totales (PEN y USD por separado)</div>
    <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-l);font-size:13px">
      <span>Total Planificado</span>
      <span style="font-weight:600">Ing PEN ${fmtMoney(totals.incPlanned.PEN,'PEN')} / USD ${fmtMoney(totals.incPlanned.USD,'USD')} &middot; Egr PEN ${fmtMoney(totals.expPlanned.PEN,'PEN')} / USD ${fmtMoney(totals.expPlanned.USD,'USD')}</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-l);font-size:13px">
      <span>Total Real</span>
      <span style="font-weight:600">Ing PEN ${fmtMoney(totals.incReal.PEN,'PEN')} / USD ${fmtMoney(totals.incReal.USD,'USD')} &middot; Egr PEN ${fmtMoney(totals.expReal.PEN,'PEN')} / USD ${fmtMoney(totals.expReal.USD,'USD')}</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px">
      <span>Balance Planif. vs Real (Ing - Egr)</span>
      <span style="font-weight:600">
        Plan PEN ${fmtMoney(totals.incPlanned.PEN-totals.expPlanned.PEN,'PEN')} / USD ${fmtMoney(totals.incPlanned.USD-totals.expPlanned.USD,'USD')}<br>
        Real PEN ${fmtMoney(totals.incReal.PEN-totals.expReal.PEN,'PEN')} / USD ${fmtMoney(totals.incReal.USD-totals.expReal.USD,'USD')}
      </span>
    </div>
  </div>`;

  return incTable + expTable + summary;
}

/* ======== PLAN MENSUAL: FIXED RECURRING FORMS ======== */

function saveFixedRecurring(editId) {
  const type = document.getElementById('fr-type').value;
  const amount = parseFloat(document.getElementById('fr-amount').value);
  const currency = document.getElementById('fr-currency').value;
  const category = document.getElementById('fr-category').value;
  const subcategory = document.getElementById('fr-subcategory') ? (document.getElementById('fr-subcategory').value||null) : null;
  const recurrencia = document.getElementById('fr-recurrencia').value === 'quincenal' ? 'quincenal' : 'mensual';
  function clampDay(v, def) { const n = parseInt(v,10); if (isNaN(n)) return def; return Math.min(31, Math.max(1, n)); }
  let diaMes1, diaMes2 = null;
  if (recurrencia === 'quincenal') {
    diaMes1 = clampDay(document.getElementById('fr-dia-q1').value, 15);
    diaMes2 = clampDay(document.getElementById('fr-dia-q2').value, 30);
  } else {
    diaMes1 = clampDay(document.getElementById('fr-dia1').value, 1);
  }
  if (!amount || amount<=0) { showToast('Ingresa un monto valido','error'); return; }
  if (!category) { showToast('Selecciona una categoria','error'); return; }
  const today = todayStr();
  if (editId) {
    const it = data.plan.fixedRecurring.find(x=>x.id===editId);
    if (it) {
      it.type = type; it.category = category; it.subcategory = subcategory;
      it.recurrencia = recurrencia; it.diaMes1 = diaMes1; it.diaMes2 = diaMes2;
      const cur = getFixedAmountAtDate(it, today);
      // Add a new version from today only if amount/currency changed
      if (!cur || cur.amount !== amount || cur.currency !== currency) {
        // if there's already a version with validFrom === today, overwrite it
        const sameDay = it.versions.find(v=>v.validFrom===today);
        if (sameDay) { sameDay.amount = amount; sameDay.currency = currency; }
        else it.versions.push({ amount, currency, validFrom: today, createdAt: new Date().toISOString() });
      }
    }
  } else {
    data.plan.fixedRecurring.push({
      id: genId(), type, category, subcategory,
      recurrencia, diaMes1, diaMes2,
      versions: [{ amount, currency, validFrom: today, createdAt: new Date().toISOString() }],
      active: true, deletedFrom: null
    });
  }
  saveData(); closeModal();
  showToast(editId?'Fijo actualizado (desde hoy)':'Fijo recurrente creado');
  renderPlan();
}
function deleteFixedRecurring(id) {
  showConfirm('Eliminar Fijo Recurrente', 'Dejará de proyectarse desde hoy en adelante. Los periodos pasados no se afectan. Continuar?', function() {
    const it = data.plan.fixedRecurring.find(x=>x.id===id);
    if (it) { it.active = false; it.deletedFrom = todayStr(); }

/* ======== PLAN V3: PROYECCION ANUAL (sobrescribe funciones anteriores) ======== */
function pad2(n){return String(n).padStart(2,'0');}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
const MS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
let planYear=new Date().getFullYear(), planCur='PEN', planOpen={}, planChart=null;

function migratePlanV3(){
  if(!data.settings) data.settings={};
  if(data.settings.migratedPlanV3) return;
  data.plan.fixedRecurring.forEach(it=>{
    const v=it.versions&&it.versions[0];
    if(v&&it.versions.length===1&&v.createdAt&&v.validFrom===v.createdAt.slice(0,10)) v.validFrom=v.validFrom.slice(0,8)+'01';
    if(!it.name) it.name=it.subcategory||it.category;
  });
  const rules=[[/piano/i,'Piano'],[/piscina/i,'Piscina'],[/p[is]+[cs][oó]logo|psic/i,'Psicólogo']];
  const fix=(o,txt)=>{ if(o.category!=='Alessandro') return; for(const [r,n] of rules){ if(r.test(txt||'')){ o.subcategory=n; return; } } };
  data.plan.fixedRecurring.forEach(o=>fix(o,(o.name||'')+' '+(o.notes||'')));
  data.plan.fixedScheduled.forEach(o=>fix(o,(o.name||'')+' '+(o.notes||'')));
  data.transactions.forEach(o=>{ if(o.type==='expense'||o.type==='debt_payment') fix(o,o.notes); });
  data.debts.forEach(o=>fix(o,(o.name||'')+' '+(o.notes||'')));
  data.settings.migratedPlanV3=true;
  saveData();
}

function pmAdd(o,t,c,s,v){ c=c||'(Sin categoría)'; s=s||''; const a=(o[t][c]=o[t][c]||{}); a[s]=(a[s]||0)+v; }
const pmSum=o=>Object.values(o).reduce((a,b)=>a+b,0);

function pmOcc(it,y,m){
  const r=it.recurrencia||'mensual', out=[];
  if(r==='cadaN'){
    const v0=(it.versions||[]).slice().sort((a,b)=>a.validFrom<b.validFrom?-1:1)[0]; if(!v0) return [];
    const p=v0.validFrom.split('-').map(Number), diff=(y-p[0])*12+(m-p[1]);
    if(diff<0||diff%(it.cadaN||1)) return [];
  } else if(r==='meses'){ if(!(it.meses||[]).includes(m)) return []; }
  const days=r==='quincenal'?[it.diaMes1||15,it.diaMes2||30]:[it.diaMes1||1];
  days.forEach(d=>{
    const ref=monthRefDate(y,m,d); if(it.hasta&&ref>it.hasta) return;
    const v=getFixedAmountAtDate(it,ref); if(v) out.push({amount:v.amount,currency:v.currency});
  });
  return out;
}
function pmDebtPlan(cur){
  const map={}, now=new Date();
  data.debts.forEach(d=>{
    if(d.status!=='active'||d.currency!==cur||!(d.cuota>0)) return;
    let rem=d.totalAmount-(d.paidAmount||0), y=now.getFullYear(), m=now.getMonth()+1, n=0;
    while(rem>0.005&&n<240){
      const a=Math.min(d.cuota,rem), k=y+'-'+pad2(m);
      (map[k]=map[k]||[]).push({category:d.category,subcategory:d.subcategory,amount:a});
      rem-=a; m++; if(m>12){m=1;y++;} n++;
    }
  });
  return map;
}
function pmAvg(cur){
  const now=new Date(), ms=[], tot={}, used=new Set();
  for(let i=1;i<=3;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1); ms.push(d.getFullYear()+'-'+pad2(d.getMonth()+1));}
  data.transactions.forEach(t=>{
    if(t.currency!==cur||!(t.type==='expense'||t.type==='debt_payment')) return;
    const k=(t.date||'').slice(0,7); if(!ms.includes(k)) return; used.add(k);
    const c=t.category||'(Sin categoría)'; tot[c]=(tot[c]||0)+t.amount;
  });
  const n=used.size||1; Object.keys(tot).forEach(c=>tot[c]/=n);
  return tot;
}
/* ---- Plan Anual v4: estado de UI ---- */
let planTab='expense', planAnPeriod='month', planAnMonth=new Date().getMonth()+1, planShowNet=false;
const pmUseAvg=()=>!(data.settings&&data.settings.planUseHistory===false);

function pmCtx(cur,useAvg){
  const bud={}; data.plan.budgets.forEach(b=>{ if(b.currency===cur) bud[b.category]=b.limitAmount; });
  return {debt:pmDebtPlan(cur),avg:useAvg===false?{}:pmAvg(cur),bud};
}
function pmSavPlan(y,m,cur){
  let s=0;
  data.plan.fixedRecurring.forEach(it=>{ if(it.type!=='savings') return; pmOcc(it,y,m).forEach(o=>{ if(o.currency===cur) s+=o.amount; }); });
  return s;
}
function pmSavReal(y,m,cur){
  const key=y+'-'+pad2(m); let s=0;
  data.transactions.forEach(t=>{
    if(t.currency!==cur||(t.date||'').slice(0,7)!==key) return;
    if(t.type==='savings_in') s+=t.amount; else if(t.type==='savings_out') s-=t.amount;
  });
  return s;
}
function pmMonth(y,m,cur,ctx){
  const now=new Date(), cy=now.getFullYear(), cm=now.getMonth()+1;
  const st=(y<cy||(y===cy&&m<cm))?'past':(y===cy&&m===cm)?'now':'future';
  const key=y+'-'+pad2(m), real={income:{},expense:{}}, fix={income:{},expense:{}};
  let saved=0;
  data.transactions.forEach(t=>{
    if(t.currency!==cur||(t.date||'').slice(0,7)!==key) return;
    if(t.type==='income') pmAdd(real,'income',t.category,t.subcategory,t.amount);
    else if(t.type==='expense'||t.type==='debt_payment') pmAdd(real,'expense',t.category,t.subcategory,t.amount);
    else if(t.type==='savings_in') saved+=t.amount;
    else if(t.type==='savings_out') saved-=t.amount;
  });
  if(st!=='past'){
    data.plan.fixedRecurring.forEach(it=>{
      if(it.type!=='income'&&it.type!=='expense') return;
      pmOcc(it,y,m).forEach(o=>{ if(o.currency===cur) pmAdd(fix,it.type,it.category,it.subcategory,o.amount); });
    });
    data.plan.fixedScheduled.forEach(it=>{ if(!it.fulfilled&&it.currency===cur&&(it.expectedDate||'').slice(0,7)===key) pmAdd(fix,it.type,it.category,it.subcategory,it.amount); });
    (ctx.debt[key]||[]).forEach(o=>pmAdd(fix,'expense',o.category,o.subcategory,o.amount));
  }
  const planSav=pmSavPlan(y,m,cur);
  const sav=st==='past'?saved:st==='now'?Math.max(saved,planSav):planSav;
  const res={st,key,saved,planSav,sav,cats:{income:{},expense:{}},inc:0,exp:0,fixExp:0,realInc:0,realExp:0};
  ['income','expense'].forEach(t=>{
    const names=new Set([...Object.keys(real[t]),...Object.keys(fix[t])]);
    if(t==='expense'&&st!=='past') Object.keys(ctx.avg).forEach(c=>names.add(c));
    names.forEach(c=>{
      const rs=real[t][c]||{}, fs=fix[t][c]||{}, rt=pmSum(rs), ft=pmSum(fs);
      let val, subs;
      if(st==='past'){ val=rt; subs=rs; }
      else {
        let base=ft;
        if(t==='expense'){ const b=ctx.bud[c]; base=Math.max(ft,b!=null?b:(ctx.avg[c]||0)); }
        if(st==='now'){
          subs={}; new Set([...Object.keys(rs),...Object.keys(fs)]).forEach(s=>subs[s]=Math.max(rs[s]||0,fs[s]||0));
          val=Math.max(rt,base,pmSum(subs));
        } else { subs=fs; val=base; }
      }
      res.cats[t][c]={val,subs,est:Math.max(0,val-pmSum(subs))};
      if(t==='income'){res.inc+=val;res.realInc+=rt;} else {res.exp+=val;res.realExp+=rt; if(st!=='past') res.fixExp+=Math.min(val,ft);}
    });
  });
  return res;
}
function pmYear(y,cur){
  const ctx=pmCtx(cur,pmUseAvg()), ms=[], now=new Date(), cy=now.getFullYear(), cm=now.getMonth()+1;
  for(let m=1;m<=12;m++) ms.push(pmMonth(y,m,cur,ctx));
  let acc=0;
  ms.forEach(c=>{ c.gross=c.inc-c.exp; c.net=c.gross-c.sav; acc+=c.net; c.accNet=acc; });
  /* Fondo de ahorro: meses pasados se reconstruyen hacia atras desde el saldo actual */
  const F=data.balances['ahorro'+cur]||0, nowKey=cy+'-'+pad2(cm), dm={};
  data.transactions.forEach(t=>{
    if(t.currency!==cur) return;
    let d;
    if(t.type==='savings_in') d=t.amount; else if(t.type==='savings_out') d=-t.amount;
    else if(t.type==='debt_payment'&&t.source==='ahorro') d=-t.amount; else return;
    const k=(t.date||'').slice(0,7); dm[k]=(dm[k]||0)+d;
  });
  ms.forEach(c=>{
    if(c.st!=='past') return;
    let f=F; Object.keys(dm).forEach(k=>{ if(k>c.key&&k<=nowKey) f-=dm[k]; }); c.fund=f;
  });
  if(y>=cy){
    let bal=(data.balances['debito'+cur]||0)+(data.balances['efectivo'+cur]||0), fb=F;
    for(let yy=cy;yy<=y;yy++) for(let mm=(yy===cy?cm:1);mm<=12;mm++){
      const c=yy===y?ms[mm-1]:pmMonth(yy,mm,cur,ctx);
      if(!('net' in c)){ c.net=c.inc-c.exp-c.sav; }
      if(c.st==='now'){ bal+= c.net-(c.realInc-c.realExp-c.saved); fb+= c.sav-c.saved; }
      else { bal+= c.net; fb+= c.sav; }
      if(yy===y){ c.bal=bal; c.fund=fb; }
    }
  }
  return ms;
}

function pmToggle(k){planOpen[k]=!planOpen[k];renderPlan();}
function pmSetYear(y){planYear=+y;renderPlan();}
function pmSetCur(c){planCur=c;renderPlan();}
function pmSetDebt(id,v){const d=data.debts.find(x=>x.id===id); if(d){d.cuota=parseFloat(v)||0; saveData(); renderPlan();}}
const pmN=v=>Math.round(v).toLocaleString('es-PE');

function pmSetTab(t){planTab=t;renderPlan();}
function pmSetAnPeriod(v){planAnPeriod=v;renderPlan();}
function pmSetAnMonth(v){planAnMonth=+v;renderPlan();}
function pmSetNet(b){planShowNet=!!b;renderPlan();}
function pmSetAvg(b){ if(!data.settings) data.settings={}; data.settings.planUseHistory=!!b; saveData(); renderPlan(); }

/* ---- Analisis macro: Plan vs Real por categoria (solo lo que el usuario cargo; sin promedio historico) ---- */
function pmAnMonths(){
  const now=new Date(), cy=now.getFullYear(), cm=now.getMonth()+1;
  if(planAnPeriod==='month') return [planAnMonth];
  if(planAnPeriod==='ytd'){ const last=planYear<cy?12:planYear===cy?cm:0; return Array.from({length:last},(_,i)=>i+1); }
  return Array.from({length:12},(_,i)=>i+1);
}
function pmDevData(tab,months,yr,cur){
  const ctx=pmCtx(cur,false), plan={}, real={};
  const add=(o,c,s,v)=>{ c=c||'(Sin categoría)'; s=s||''; const a=(o[c]=o[c]||{}); a[s]=(a[s]||0)+v; };
  months.forEach(m=>{
    const key=yr+'-'+pad2(m), fx={};
    data.plan.fixedRecurring.forEach(it=>{
      if(it.type!==tab) return;
      pmOcc(it,yr,m).forEach(o=>{ if(o.currency===cur) add(fx,it.category,it.subcategory,o.amount); });
    });
    data.plan.fixedScheduled.forEach(it=>{
      if(it.type===tab&&!it.fulfilled&&it.currency===cur&&(it.expectedDate||'').slice(0,7)===key) add(fx,it.category,it.subcategory,it.amount);
    });
    if(tab==='expense') (ctx.debt[key]||[]).forEach(o=>add(fx,o.category,o.subcategory,o.amount));
    const cats=new Set(Object.keys(fx));
    if(tab==='expense') Object.keys(ctx.bud).forEach(c=>cats.add(c));
    cats.forEach(c=>{
      const subs=fx[c]||{}, ft=pmSum(subs);
      Object.keys(subs).forEach(s=>add(plan,c,s,subs[s]));
      if(tab==='expense'&&ctx.bud[c]!=null&&ctx.bud[c]>ft) add(plan,c,'__bud',ctx.bud[c]-ft);
    });
  });
  const keys=new Set(months.map(m=>yr+'-'+pad2(m)));
  data.transactions.forEach(t=>{
    if(t.currency!==cur||!keys.has((t.date||'').slice(0,7))) return;
    const ok=(tab==='income'&&t.type==='income')||(tab==='expense'&&(t.type==='expense'||t.type==='debt_payment'));
    if(ok) add(real,t.category,t.subcategory,t.amount);
  });
  const names=new Set([...Object.keys(plan),...Object.keys(real)]);
  return Array.from(names).map(c=>{
    const ps=plan[c]||{}, rs=real[c]||{};
    const subs=Array.from(new Set([...Object.keys(ps),...Object.keys(rs)])).map(s=>{ const p=ps[s]||0, r=rs[s]||0; return {s,p,r,d:r-p}; })
      .sort((u,v)=>Math.abs(v.d)-Math.abs(u.d));
    const p=pmSum(ps), r=pmSum(rs);
    return {c,p,r,d:r-p,subs};
  }).filter(x=>x.p>0.005||Math.abs(x.r)>0.005).sort((u,v)=>Math.abs(v.d)-Math.abs(u.d));
}
function pmAnalysisHtml(cur){
  const months=pmAnMonths(), tab=planTab, bad=(tab==='expense');
  const dcol=d=>Math.abs(d)<0.005?'':('color:'+(((d>0)===!bad)?'#22c55e':'#ef4444')+';');
  const pct=(p,d)=>p>0.005?((d>=0?'+':'')+(d/p*100).toFixed(1)+'%'):'—';
  const sgn=d=>(d>0.005?'+':'')+pmN(d);
  const tabBtn=(k,l)=>`<button class="btn btn-sm ${tab===k?'btn-primary':'btn-secondary'}" onclick="pmSetTab('${k}')">${l}</button>`;
  const perSel=`<select class="form-control" style="width:auto" onchange="pmSetAnPeriod(this.value)">
      <option value="month" ${planAnPeriod==='month'?'selected':''}>Mes</option>
      <option value="ytd" ${planAnPeriod==='ytd'?'selected':''}>Acumulado del año a la fecha</option>
      <option value="year" ${planAnPeriod==='year'?'selected':''}>Año completo</option></select>`;
  const monSel=planAnPeriod==='month'?`<select class="form-control" style="width:auto" onchange="pmSetAnMonth(this.value)">${MS.map((n,i)=>`<option value="${i+1}" ${planAnMonth===i+1?'selected':''}>${n}</option>`).join('')}</select>`:'';
  const head=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">${tabBtn('income','Ingresos')}${tabBtn('expense','Gastos')}${tabBtn('savings','Ahorro')}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">${perSel}${monSel}<span style="font-size:11px;color:var(--text-xs)">${planYear}</span></div>`;
  if(!months.length) return head+'<div class="empty-state" style="padding:16px"><p>Aún no hay meses transcurridos en este año.</p></div>';
  const th=(a,b)=>`<th style="text-align:${a};padding:6px 8px">${b}</th>`;
  const heads=th('left','Categoría')+th('right','Plan')+th('right','Real')+th('right','Desviación')+th('right','% desv.');
  const td=(v,st)=>`<td style="text-align:right;padding:6px 8px;white-space:nowrap;${st||''}">${v}</td>`;
  let body='';
  if(tab==='savings'){
    let tp=0,tr=0;
    months.forEach(m=>{
      const p=pmSavPlan(planYear,m,cur), r=pmSavReal(planYear,m,cur), d=r-p; tp+=p; tr+=r;
      body+=`<tr><td style="padding:6px 8px">${MS[m-1]}</td>${td(pmN(p))}${td(pmN(r))}${td(sgn(d),dcol(d))}${td(pct(p,d),dcol(d))}</tr>`;
    });
    const d=tr-tp;
    body+=`<tr style="font-weight:700"><td style="padding:6px 8px">TOTAL</td>${td(pmN(tp))}${td(pmN(tr))}${td(sgn(d),dcol(d))}${td(pct(tp,d),dcol(d))}</tr>`;
    return head+`<div class="table-wrap card" style="padding:0"><table style="min-width:520px"><thead><tr>${th('left','Mes')+th('right','Plan')+th('right','Real')+th('right','Desviación')+th('right','% desv.')}</tr></thead><tbody>${body}</tbody></table></div>
      <div style="font-size:11px;color:var(--text-xs);margin:6px 0 16px">Plan = fijos recurrentes de tipo Ahorro. Real = ahorro aportado − retirado (movimientos reales).</div>`;
  }
  const rows=pmDevData(tab,months,planYear,cur);
  if(!rows.length) return head+'<div class="empty-state" style="padding:16px"><p>Sin plan ni movimientos en este periodo.</p></div>';
  let tp=0,tr=0;
  rows.forEach(r=>{
    tp+=r.p; tr+=r.r;
    const k='dev|'+tab+'|'+r.c, open=planOpen[k];
    body+=`<tr style="cursor:pointer;font-weight:600" onclick="pmToggle(${JSON.stringify(k).replace(/"/g,'&quot;')})"><td style="padding:6px 8px">${open?'▾':'▸'} ${r.c}</td>${td(pmN(r.p))}${td(pmN(r.r))}${td(sgn(r.d),dcol(r.d))}${td(pct(r.p,r.d),dcol(r.d))}</tr>`;
    if(open) r.subs.forEach(s=>{
      const lbl=s.s==='__bud'?'Presupuesto sin asignar':(s.s||'Sin subcategoría');
      body+=`<tr style="font-size:12px;color:var(--text-s)"><td style="padding:4px 8px 4px 24px">${lbl}</td>${td(pmN(s.p))}${td(pmN(s.r))}${td(sgn(s.d),dcol(s.d))}${td(pct(s.p,s.d),dcol(s.d))}</tr>`;
    });
  });
  const dt=tr-tp;
  body+=`<tr style="font-weight:700;border-top:2px solid var(--border)"><td style="padding:6px 8px">TOTAL</td>${td(pmN(tp))}${td(pmN(tr))}${td(sgn(dt),dcol(dt))}${td(pct(tp,dt),dcol(dt))}</tr>`;
  const note=tab==='expense'
    ?'Plan = fijos recurrentes + programados no cumplidos + presupuesto de la categoría + cuotas de deuda. Sin plan, todo lo ejecutado aparece como desviación. Rojo = gasté más de lo planificado; verde = menos.'
    :'Plan = fijos recurrentes + programados no cumplidos. Sin plan, todo lo recibido aparece como desviación. Verde = recibí más de lo planificado; rojo = menos.';
  return head+`<div class="table-wrap card" style="padding:0"><table style="min-width:520px"><thead><tr>${heads}</tr></thead><tbody>${body}</tbody></table></div>
    <div style="font-size:11px;color:var(--text-xs);margin:6px 0 16px">${note} (Toca una categoría para ver subcategorías; no usa el promedio de 3 meses.)</div>`;
}

  <div style="font-size:11px;color:var(--text-xs);margin:6px 0 16px">Gastos incluyen pagos de deuda. Margen bruto = Ingresos − Gastos. Ahorro = aportes − retiros reales (meses pasados), el mayor entre real y planificado (mes actual) o el planificado (meses futuros). Liquidez neta = Margen bruto − Ahorro. Real = lo registrado; Hoy = real + lo que falta; Proy. = fijos + cuotas + estimado variable (presupuesto de la categoría${pmUseAvg()?', o promedio de los últimos 3 meses':''}).</div>`;

      <h2 style="font-size:20px;font-weight:700">Plan Anual</h2>

        <button class="btn btn-sm ${cur==='PEN'?'btn-primary':'btn-secondary'}" onclick="pmSetCur('PEN')">PEN</button>

      </div>
    </div>
    <label style="display:flex;gap:8px;align-items:center;font-size:12px;margin-bottom:10px;cursor:pointer"><input type="checkbox" ${pmUseAvg()?'checked':''} onchange="pmSetAvg(this.checked)"> Incluir estimado por historial en la proyección (promedio de 3 meses)</label>

    ${grid}
    <div class="chart-box"><h4>Ingresos, Gastos y Ahorro ${planYear}</h4>
      <label style="display:flex;gap:8px;align-items:center;font-size:12px;margin:4px 0 8px;cursor:pointer"><input type="checkbox" ${planShowNet?'checked':''} onchange="pmSetNet(this.checked)"> Mostrar Liquidez neta (punteada)</label>
      <div style="height:280px"><canvas id="plan-chart"></canvas></div>
      <div style="font-size:11px;color:var(--text-xs);margin-top:6px">Línea sólida = real · línea punteada = proyectado. Toca un punto del gráfico o usa las pestañas para filtrar el análisis.</div></div>
    <div class="settings-section"><h3>Análisis por categoría: Plan vs Real</h3>${pmAnalysisHtml(cur)}</div>

function pmChart(ms){
  const el=document.getElementById('plan-chart'); if(!el||typeof Chart==='undefined') return;
  if(planChart){planChart.destroy();planChart=null;}
  Chart.defaults.color='#9ca3af';
  const seg={borderDash:c=>(ms[c.p1DataIndex]&&ms[c.p1DataIndex].st==='future')?[6,4]:undefined};
  const ds=(label,key,color)=>({label,data:ms.map(c=>c[key]),borderColor:color,backgroundColor:color,
    pointBackgroundColor:ms.map(c=>c.st==='future'?'transparent':color),pointBorderColor:color,
    tension:.25,borderWidth:2,pointRadius:3,pointHoverRadius:6,pointHitRadius:12,segment:seg});
  const sets=[ds('Ingresos','inc','#22c55e'),ds('Gastos','exp','#ef4444'),ds('Ahorro','sav','#3b82f6')];
  if(planShowNet) sets.push({label:'Liquidez neta',data:ms.map(c=>c.net),borderColor:'#a78bfa',backgroundColor:'#a78bfa',borderDash:[2,3],tension:.25,borderWidth:2,pointRadius:2});
  const tabs=['income','expense','savings'];
  planChart=new Chart(el,{type:'line',data:{labels:MS,datasets:sets},options:{responsive:true,maintainAspectRatio:false,
    interaction:{mode:'nearest',intersect:true},
    onClick:(evt,els)=>{ if(!els||!els.length) return; const di=els[0].datasetIndex; if(di<3){ planTab=tabs[di]; renderPlan(); } },
    plugins:{legend:{position:'bottom',labels:{usePointStyle:true}}},
    scales:{x:{grid:{display:false}},y:{grid:{color:'rgba(255,255,255,.08)'}}}}});
}

function pmRecTxt(it){
  const r=it.recurrencia||'mensual';
  if(r==='quincenal') return 'Quincenal (días '+(it.diaMes1||15)+' y '+(it.diaMes2||30)+')';
  if(r==='cadaN') return 'Cada '+(it.cadaN||1)+' meses (día '+(it.diaMes1||1)+')';
  if(r==='meses') return 'Meses: '+(it.meses||[]).map(m=>MS[m-1]).join(', ')+' (día '+(it.diaMes1||1)+')';
  return 'Mensual (día '+(it.diaMes1||1)+')';
}
function renderFixedRecurringList(){
  const items=data.plan.fixedRecurring;
  if(!items.length) return '<div class="empty-state" style="padding:16px"><p>Sin fijos recurrentes</p></div>';
  const today=todayStr();
  return items.map(it=>{
    const v=getFixedAmountAtDate(it,today)||it.versions[it.versions.length-1], del=it.active===false;
    const badge=it.type==='income'?'<span class="type-badge income">Ingreso</span>':it.type==='savings'?'<span class="type-badge" style="background:var(--blue-bg);color:var(--blue)">Ahorro</span>':'<span class="type-badge expense">Egreso</span>';
    const first=it.versions.slice().sort((a,b)=>a.validFrom<b.validFrom?-1:1)[0];
    return `<div style="padding:12px 0;border-bottom:1px solid var(--border-l);${del?'opacity:.55':''}"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div style="flex:1">
      <strong>${it.name||it.category}</strong> ${badge}
      <div style="font-size:12px;color:var(--text-s)">${it.type==='savings'?'Ahorro planificado':(it.category||'-')}${it.subcategory?' - '+it.subcategory:''} · ${pmRecTxt(it)}</div>
      <div style="font-size:11px;color:var(--text-xs)">Desde ${fmtDate(first.validFrom)}${it.hasta?' hasta '+fmtDate(it.hasta):''}${it.notes?' · '+it.notes:''}</div>
      <div style="font-size:13px;font-weight:600;margin-top:2px">${del?'Eliminado':fmtMoney(v.amount,v.currency)}${del&&it.deletedFrom?' <span style="font-size:11px;color:var(--red);font-weight:400">(desde '+fmtDate(it.deletedFrom)+')</span>':''}</div></div>
      <div class="row-actions">${!del?`<button class="edit-btn" onclick="showFixedRecurringForm('${it.id}')">&#9998;</button><button class="del-btn" onclick="deleteFixedRecurring('${it.id}')">&#128465;</button>`:`<button class="edit-btn" onclick="reactivateFixedRecurring('${it.id}')">&#8635;</button>`}</div></div></div>`;
  }).join('');
}
function pmRecChange(){
  const r=document.getElementById('fr-rec').value;
  document.getElementById('fr-w-d2').style.display=r==='quincenal'?'block':'none';
  document.getElementById('fr-w-n').style.display=r==='cadaN'?'block':'none';
  document.getElementById('fr-w-m').style.display=r==='meses'?'block':'none';
}
function showFixedRecurringForm(editId){
  const it=editId?data.plan.fixedRecurring.find(x=>x.id===editId):null;
  const v=it?(getFixedAmountAtDate(it,todayStr())||it.versions[it.versions.length-1]):null;
  const desde=it?it.versions.slice().sort((a,b)=>a.validFrom<b.validFrom?-1:1)[0].validFrom:todayStr().slice(0,8)+'01';
  const r=it?(it.recurrencia||'mensual'):'mensual', t=it?it.type:'income';
  const opt=(val,lbl)=>`<option value="${val}" ${r===val?'selected':''}>${lbl}</option>`;
  openModal(`<div class="modal-header"><h3>${it?'Editar':'Nuevo'} Fijo Recurrente</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
  <div class="modal-body">
    ${it?'<div style="font-size:12px;color:var(--text-s);margin-bottom:12px">Si cambias el monto, el nuevo valor aplica desde HOY; el anterior se conserva para meses pasados.</div>':''}
    <div class="form-group"><label>Nombre</label><input class="form-control" id="fr-name" value="${it&&it.name?it.name.replace(/"/g,'&quot;'):''}" placeholder="Ej: Taller de piano"></div>
    <div class="form-group"><label>Tipo *</label><select class="form-control" id="fr-type" onchange="onFrTypeChange()"><option value="income" ${t==='income'?'selected':''}>Ingreso</option><option value="expense" ${t==='expense'?'selected':''}>Egreso</option><option value="savings" ${t==='savings'?'selected':''}>Ahorro</option></select></div>
    <div class="form-row"><div class="form-group"><label>Monto *</label><input type="number" class="form-control" id="fr-amount" step="0.01" min="0.01" value="${v?v.amount:''}"></div>
    <div class="form-group"><label>Moneda *</label><select class="form-control" id="fr-currency"><option value="PEN" ${!v||v.currency==='PEN'?'selected':''}>PEN (S/)</option><option value="USD" ${v&&v.currency==='USD'?'selected':''}>USD ($)</option></select></div></div>
    <div class="form-group" id="fr-cat-wrap"><label>Categoría *</label><select class="form-control" id="fr-category" onchange="onFrCatChange()">${planCatOptions(it?it.category:'',t)}</select></div>
    <div class="form-group" id="fr-subcat-wrap" style="display:none"><label>Subcategoría</label><select class="form-control" id="fr-subcategory"><option value="">Sin subcategoria</option></select></div>
    <div class="form-group"><label>Recurrencia *</label><select class="form-control" id="fr-rec" onchange="pmRecChange()">${opt('mensual','Mensual')}${opt('quincenal','Quincenal')}${opt('cadaN','Cada N meses')}${opt('meses','Meses específicos')}</select></div>
    <div class="form-row"><div class="form-group"><label>Día del mes</label><input type="number" class="form-control" id="fr-d1" min="1" max="31" value="${it&&it.diaMes1?it.diaMes1:1}"></div>
    <div class="form-group" id="fr-w-d2"><label>Día 2 (quincena)</label><input type="number" class="form-control" id="fr-d2" min="1" max="31" value="${it&&it.diaMes2?it.diaMes2:30}"></div></div>
    <div class="form-group" id="fr-w-n"><label>Cada cuántos meses</label><input type="number" class="form-control" id="fr-n" min="1" value="${it&&it.cadaN?it.cadaN:2}"></div>
    <div class="form-group" id="fr-w-m"><label>Meses</label><div style="display:flex;flex-wrap:wrap;gap:6px">${MS.map((n,i)=>`<label style="font-size:12px"><input type="checkbox" class="fr-mes" value="${i+1}" ${it&&(it.meses||[]).includes(i+1)?'checked':''}> ${n}</label>`).join('')}</div></div>
    <div class="form-row"><div class="form-group"><label>Desde</label><input type="date" class="form-control" id="fr-desde" value="${desde}"></div>
    <div class="form-group"><label>Hasta (opcional)</label><input type="date" class="form-control" id="fr-hasta" value="${it&&it.hasta?it.hasta:''}"></div></div>
    <div class="form-group"><label>Comentario</label><input class="form-control" id="fr-notes" value="${it&&it.notes?it.notes.replace(/"/g,'&quot;'):''}" placeholder="Opcional"></div>
  </div>
  <div class="modal-footer"><button class="btn btn-primary btn-block" onclick="saveFixedRecurring('${editId||''}')">${it?'Actualizar':'Crear'}</button></div>`);
  if(it&&it.category) onFrCatChange(it.subcategory);
  pmRecChange(); frSavVis();
}
function frSavVis(){
  const t=document.getElementById('fr-type').value, w=document.getElementById('fr-cat-wrap');
  if(w) w.style.display=t==='savings'?'none':'block';
  if(t==='savings') document.getElementById('fr-subcat-wrap').style.display='none';
}
function saveFixedRecurring(editId){
  const g=id=>document.getElementById(id).value, type=g('fr-type'), amount=parseFloat(g('fr-amount')), currency=g('fr-currency'), category=g('fr-category');
  const subcategory=document.getElementById('fr-subcategory')?(g('fr-subcategory')||null):null, rec=g('fr-rec');
  const name=g('fr-name').trim()||(type==='savings'?'Ahorro':(subcategory||category)), notes=g('fr-notes').trim();
  const cl=(v,d)=>{const n=parseInt(v,10);return isNaN(n)?d:Math.min(31,Math.max(1,n));};
  const diaMes1=cl(g('fr-d1'),rec==='quincenal'?15:1), diaMes2=rec==='quincenal'?cl(g('fr-d2'),30):null;
  const cadaN=Math.max(1,parseInt(g('fr-n'),10)||1), meses=[...document.querySelectorAll('.fr-mes:checked')].map(x=>+x.value);
  const desde=g('fr-desde')||todayStr().slice(0,8)+'01', hasta=g('fr-hasta')||null, today=todayStr();
  if(!amount||amount<=0){showToast('Ingresa un monto valido','error');return;}
  if(type!=='savings'&&!category){showToast('Selecciona una categoria','error');return;}
  if(rec==='meses'&&!meses.length){showToast('Marca al menos un mes','error');return;}
  const f={type,category:type==='savings'?null:category,subcategory:type==='savings'?null:subcategory,name,notes,recurrencia:rec,diaMes1,diaMes2,cadaN,meses,hasta};
  if(editId){
    const it=data.plan.fixedRecurring.find(x=>x.id===editId); if(!it) return;
    Object.assign(it,f);
    it.versions.sort((a,b)=>a.validFrom<b.validFrom?-1:1)[0].validFrom=desde;
    const cur=getFixedAmountAtDate(it,today);
    if(!cur||cur.amount!==amount||cur.currency!==currency){
      const same=it.versions.find(v=>v.validFrom===today);
      if(same){same.amount=amount;same.currency=currency;} else it.versions.push({amount,currency,validFrom:today,createdAt:new Date().toISOString()});
    }
  } else data.plan.fixedRecurring.push(Object.assign({id:genId(),versions:[{amount,currency,validFrom:desde,createdAt:new Date().toISOString()}],active:true,deletedFrom:null},f));
  saveData(); closeModal(); showToast(editId?'Fijo actualizado':'Fijo recurrente creado'); renderPlan();
}

/* ======== INITIALIZATION ======== */
loadData();
migrateCategoriesV2();
migratePlanV3();
applyTheme();
</script>

</body></html>
